name: Issue antispam

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

# Keyed per comment so that a spammer's second comment does not cancel the moderation of the first.
concurrency:
  group: antispam-${{ github.event.comment.id || github.event.issue.number }}
  cancel-in-progress: true

env:
  DRY_RUN: "false"

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !endsWith(github.actor, '[bot]') }}
    steps:
      - name: Detect and neutralize malware posting
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          EVENT_JSON=$(cat "$GITHUB_EVENT_PATH")

          BODY=$(jq -r '.comment.body // .issue.body // ""' <<<"$EVENT_JSON")
          NODE_ID=$(jq -r '.comment.node_id // empty' <<<"$EVENT_JSON")
          AUTHOR_ASSOC=$(jq -r '.comment.author_association // .issue.author_association // "NONE"' <<<"$EVENT_JSON")
          LOGIN=$(jq -r '.comment.user.login // .issue.user.login // ""' <<<"$EVENT_JSON")

          echo "Checking content from @$LOGIN ($AUTHOR_ASSOC)"

          case "$AUTHOR_ASSOC" in
            OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR)
              echo "Trusted author, skipped."; exit 0 ;;
          esac

          # Only strong signals act: the social-engineering patterns also match genuine
          # reports ("Bloodborne crashes on my PC"), so on their own they only warn.
          STRONG=0
          strong() { echo "::warning::$1"; STRONG=1; }
          weak() { echo "::notice::$1"; }

          if grep -qiE '(^|[^a-z])(iex|invoke-expression)[ (]*\( *(irm|iwr|invoke-restmethod|invoke-webrequest|wget|curl)[ )]*\(' <<<"$BODY"; then
            strong "iex(irm ...) one-liner"
          fi
          if grep -qiE "(^|[^a-z])i[^a-z0-9 ]?e[^a-z0-9 ]?x[^a-z0-9]*i?[^a-z0-9 ]?(r[^a-z0-9 ]?m|w[^a-z0-9 ]?r)([^a-z]|$)" <<<"$BODY"; then
            strong "Possibly obfuscated iex/irm"
          fi
          if grep -qiE '(curl|wget)[^|]*\|[ ]*(bash|sh|powershell|pwsh|iex)' <<<"$BODY"; then
            strong "Remote download piped to a shell"
          fi

          BAD_DOMAINS=(gitrm.sbs gitrm.online gitrm.xyz gamesrepair.top pcfixhub.click)
          for d in "${BAD_DOMAINS[@]}"; do
            if grep -qiF "$d" <<<"$BODY"; then
              strong "Known malicious domain: $d"
            fi
          done
          if grep -qiE '(irm|iwr|iex|\()[ ]*"?https?://[^ ]*\.(sbs|top|xyz|click)\b' <<<"$BODY"; then
            strong "Suspicious URL (.sbs/.top/.xyz/.click) in an execution context"
          fi

          if grep -qiE '(win\s*\+\s*x).*(terminal|powershell)[^.]*(admin)' <<<"$BODY"; then
            weak "Win+X -> Terminal (Admin) instruction"
          fi
          if grep -qiE '(bloodborne|elden ring|sekiro|demons? souls|ps[45] emulator).{0,80}(pc|windows)' <<<"$BODY" \
             && grep -qiE '(fix|crash|instal|setup|all.?in.?one)' <<<"$BODY"; then
            weak "Fake PC game fix"
          fi
          if grep -qiE '(cop[íi]a|copy|paste|pegue|pega).{0,40}(command|comando|this|esto|the following|el siguiente)' <<<"$BODY" \
             && grep -qiE '(power ?shell|terminal \(admin\)|window|ventana)' <<<"$BODY"; then
            weak "Instructions to paste a command into PowerShell"
          fi

          if (( STRONG == 0 )); then
            echo "No spam detected."; exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "::error::DRY_RUN: would have acted against @$LOGIN."
            exit 1
          fi

          if [ -n "$NODE_ID" ]; then
            gh api graphql \
              -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: ABUSE}) { minimizedComment { isMinimized } } }' \
              -f id="$NODE_ID"
            echo "Comment hidden as abuse."
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "spam" \
              || echo "::warning::Could not add the spam label (does it exist?)"
            gh issue close "$ISSUE_NUMBER" --repo "$REPO" \
              --reason "not planned" \
              --comment "Closed automatically: this content asks to run code from an untrusted source (possible malware). If this is a mistake, mention this issue's number in a new one."
            gh api -X PUT "repos/$REPO/issues/$ISSUE_NUMBER/lock" -f lock_reason="spam" \
              || echo "::warning::Could not lock the issue"
            echo "Issue closed and locked."
          fi
