# decanter-reports behind Traefik, on the same pattern as the other public services of the home server: the external
# network `expose-public`, the constraint label and the `websecure` entry point. It runs a published image and reads
# its whole configuration, secrets included, from .env next to this file: install.sh sets both up in a deployment
# folder outside the checkout. docs/deploy.md ("Docker and Traefik") explains every value.
services:
  decanter-reports:
    image: ${REPORTS_IMAGE:?set REPORTS_IMAGE in .env (run install.sh)}
    container_name: decanter-reports
    restart: unless-stopped
    env_file: .env
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    ulimits:
      nofile: 4096
    stop_grace_period: 10s
    # No published ports: only Traefik reaches the server, through expose-public.
    labels:
      - traefik.enable=true
      - traefik.constraint-label=expose-public
      - traefik.http.routers.decanter-reports.rule=Host(`${REPORTS_HOST:?set REPORTS_HOST in .env (run install.sh)}`)
      - traefik.http.routers.decanter-reports.entrypoints=websecure
      - traefik.http.routers.decanter-reports.tls=true
      - traefik.http.routers.decanter-reports.service=decanter-reports
      # Only the tunnel may reach this router: cf-connecting-ip is trusted for the per-IP limits, so a client that
      # connected to Traefik directly (from the LAN) could choose the address the limits count.
      - traefik.http.routers.decanter-reports.middlewares=decanter-reports-origin
      - traefik.http.middlewares.decanter-reports-origin.ipallowlist.sourcerange=${TUNNEL_SOURCE:?set TUNNEL_SOURCE in .env (run install.sh)}
      - traefik.http.middlewares.decanter-reports-origin.ipallowlist.rejectstatuscode=404
      - traefik.http.services.decanter-reports.loadbalancer.server.port=8787
    networks:
      - expose-public

networks:
  expose-public:
    external: true
