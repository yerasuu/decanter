[package]
name = "achv-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
dirs = "7.0.0"
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["v4"] }
keyring = "3"
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
tracing = "0.1.44"
