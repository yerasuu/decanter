[package]
name = "decanter-core"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
dirs.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }
# keyring has no default backend, and without one falls back to its `mock`
# store, which isn't shared between calls (every `Entry::new()` is its own
# throwaway instance) — a session save silently didn't survive past the
# call that made it. `dbus-secret-service-keyring-store` is the blocking
# D-Bus backend `credentials.rs`'s own doc comment describes.
# The default `v1` feature already picks the native store on Windows
# (Credential Manager) and macOS (Keychain).
keyring = { workspace = true, features = ["dbus-secret-service-keyring-store"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
fs4.workspace = true
