[package]
name = "decanter-core"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
dirs.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true
keyring-core.workspace = true
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
getrandom.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs"] }
# The Secret Service over zbus (GNOME Keyring, KWallet, KeePassXC); `crypto-rust` encrypts the
# session with it without linking OpenSSL.
zbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
fs4.workspace = true
sys-locale.workspace = true
