[package]
name = "decanter-thunderstore"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Read-only use of Thunderstore's public API as docs/mod-platforms-analysis.md section 2 describes it;
# every archive is handed to decanter-mods' import, which alone extracts.
[dependencies]
decanter-core.workspace = true
decanter-mods.workspace = true
reqwest = { workspace = true, features = ["system-proxy"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "fs", "io-util"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
