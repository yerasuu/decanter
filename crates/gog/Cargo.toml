[package]
name = "decanter-gog"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
decanter-core.workspace = true
decanter-runtime.workspace = true
gog.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "fs", "sync", "time", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json", "query", "stream", "charset", "system-proxy"] }
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
md5.workspace = true
flate2.workspace = true
url.workspace = true
futures-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

# `gog` (transitive) builds `curl` against the system's libcurl/OpenSSL by
# default — pinning the same `curl` crate here with these features unifies
# the whole build onto a vendored, statically-linked copy of both instead.
curl = { workspace = true, features = ["static-curl", "static-ssl"] }
