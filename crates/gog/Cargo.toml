[package]
name = "decanter-gog"
version.workspace = true
# src/api began as gog 0.5.0 by nicohman (GPL-3.0-only); its last derived files were rewritten clean-room,
# so the whole crate is decanter's own (see src/api/VENDOR.md).
license = "GPL-3.0-or-later"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
decanter-core.workspace = true
decanter-runtime.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "fs", "sync", "time", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json", "query", "stream", "charset", "system-proxy"] }
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
md5.workspace = true
flate2.workspace = true
plist.workspace = true
url.workspace = true
futures-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
# Where a native game's save folders are (`save_location::UserFolders::native`).
dirs.workspace = true
