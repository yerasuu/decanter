[package]
name = "achv-gog"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
achv-core = { path = "../core" }
achv-runtime = { path = "../runtime" }
gog = "0.5.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "fs", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2.0.20"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"
flate2 = "1"
url = "2"
futures-util = "0.3"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }
