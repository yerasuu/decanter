[workspace]
resolver = "2"
members = ["crates/core", "crates/gog", "crates/nix", "crates/ps", "crates/report", "crates/runtime", "app"]
# `app` is the workspace's only binary crate (decanter) — this is what lets
# `cargo run`/`cargo build` from the workspace root pick it without an
# explicit `-p`/`--package`.
default-members = ["app"]
# `crates/hook` cross-compiles a Windows cdylib (`unsafe_code = "forbid"`
# above doesn't even apply to it) and is built with its own target and
# linker -- joining this workspace would apply this Cargo.lock and these
# lints to a crate neither fits, and previously left it unable to run
# `cargo check`/`cargo build` on its own at all (`cargo` refuses a nested
# manifest that "believes it's in a workspace when it's not" without this).
exclude = ["crates/hook", "crates/reports-server"]

[workspace.package]
version = "0.3.4"
authors = []
edition = "2024"
# gpui at the pinned zed rev calls `std::hint::cold_path`, stable since 1.95.
rust-version = "1.95"
license = "GPL-3.0-or-later"

# One version of each dependency for the whole workspace; members pick the
# features they need on top.
[workspace.dependencies]
decanter-core = { path = "crates/core" }
decanter-gog = { path = "crates/gog" }
decanter-nix = { path = "crates/nix" }
decanter-ps = { path = "crates/ps" }
decanter-report = { path = "crates/report" }
decanter-runtime = { path = "crates/runtime" }
# Zed's repository at a pinned commit: the crates.io release of gpui no
# longer builds.
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f" }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = "4.6.7"
# decanter-gog's `api` module builds `curl` against the system's libcurl/OpenSSL
# by default — see crates/gog for the features that vendor both instead.
curl = "0.4.51"
dirs = "7.0.0"
error-chain = "0.12.4"
flate2 = "1.1.10"
futures = "0.3.34"
futures-util = "0.3.34"
# Free disk space where nix's statvfs isn't used (Windows, macOS).
fs4 = { version = "1.1.0", default-features = false }
# The close-game shortcut on Windows and macOS; Linux registers it with
# KGlobalAccel over D-Bus.
global-hotkey = "0.9.0"
image = "0.25.10"
keyring = "4.2.0"
ksni = "0.3.7"
log = "0.4.34"
md5 = "0.8.1"
# Verifies decanter's own AppImage updates (app/src/self_update.rs); pinned
# exactly so a new release of what decides which binary runs gets read first.
minisign-verify = "=0.3.0"
nix = { version = "0.31.3", default-features = false }
open = "5.4.5"
# A macOS build's Info.plist, which names the app bundle's executable; XML or
# binary, both of which bundles ship (decision #892).
plist = { version = "1.10.3", default-features = false }
regex = "1.13.1"
# `default-tls` pulls in native-tls, which links the system's OpenSSL —
# rustls is pure Rust, no system TLS library to find at build or link time.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rfd = "0.17.2"
rusqlite = "0.41.0"
rust-i18n = "4.2.4"
select = "0.6.1"
serde = "1.0.229"
serde_json = "1.0.154"
# Already in the graph through the TLS stack; listed for the nix-portable
# checksum in crates/ps.
sha2 = "0.11.1"
# The system language where no POSIX locale variable carries it (Windows'
# user default locale, macOS's preferred languages); already locked through
# cosmic-text.
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The tray on Windows and macOS; Linux keeps ksni (see app/src/platform/linux/tray.rs).
tray-icon = { version = "0.26.1", default-features = false }
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = "1.29.0"
# Job Objects for native Windows game sessions, through a safe API since the
# workspace forbids `unsafe`.
win32job = "2.0.3"
# Already in the graph through ksni, GPUI and the keyring; decanter talks to
# KGlobalAccel and the notification server with it, on the tokio runtime.
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "proxy"] }

# GPUI unoptimized is slow enough to misjudge the app's own performance by,
# so dependencies are always built optimized; the workspace's own crates
# stay quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What scripts/appimage ships. One LTO'd codegen unit cuts the binary from
# ~88 MB to ~60 MB and ~5 MB off the resident code, at a release build of
# several minutes — too slow for `--release` while iterating.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"

redundant_clone = "deny"
clone_on_ref_ptr = "deny"
unnecessary_to_owned = "deny"

unnecessary_cast = "deny"
let_unit_value = "deny"
unnecessary_wraps = "deny"

trait_duplication_in_bounds = "deny"
extra_unused_type_parameters = "deny"
multiple_bound_locations = "deny"

unnecessary_filter_map = "deny"
needless_collect = "deny"
manual_flatten = "deny"
flat_map_option = "deny"

mutex_atomic = "deny"
mutex_integer = "deny"

format_in_format_args = "deny"
to_string_in_format_args = "deny"
string_lit_as_bytes = "deny"
uninlined_format_args = "deny"

derivable_impls = "deny"
partial_pub_fields = "deny"

match_like_matches_macro = "deny"
match_same_arms = "deny"
match_wild_err_arm = "deny"

panic = "deny"
expect_used = "deny"
unwrap_used = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

empty_docs = "warn"
