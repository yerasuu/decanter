<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0e141b;
    --bg-panel:#1b2838;
    --bg-panel-2:#16202c;
    --bg-panel-3:#0f1720;
    --bg-panel-light:#2a3f5a;
    --line:#2a3947;
    --accent-blue:#66c0f4;
    --accent-blue-dim:#4a7a96;
    --accent-green:#a4d007;
    --accent-gold:#e0b03e;
    --text-primary:#c6d4df;
    --text-muted:#8f98a0;
    --text-dim:#5c6b76;
    --text-bright:#ffffff;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    overflow:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--text-bright);
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;border:none;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--bg-panel-light);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===== APP SHELL ===== */
  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    grid-template-rows:52px 1fr;
    height:100vh;
  }

  /* top strip */
  .topbar{
    grid-column:1/3;
    background:var(--bg-panel-2);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;
    padding:0 20px;gap:24px;
  }
  .logo{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.08em;color:var(--text-bright);
    display:flex;align-items:center;gap:8px;
  }
  .logo .dot{width:7px;height:7px;background:var(--accent-blue);border-radius:50%;box-shadow:0 0 8px var(--accent-blue);}
  .topnav{display:flex;gap:22px;}
  .topnav a{
    font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--text-muted);text-decoration:none;padding:16px 0;
    border-bottom:2px solid transparent;
  }
  .topnav a.active{color:var(--text-bright);border-bottom-color:var(--accent-blue);}
  .topnav a:hover{color:var(--text-bright);}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
  .status .pip{width:8px;height:8px;border-radius:50%;background:var(--accent-green);}
  .avatar{width:28px;height:28px;border-radius:3px;background:linear-gradient(135deg,#3a5a4a,#101c26);border:1px solid var(--line);}

  /* ===== LEFT: GAME LIST ===== */
  .sidebar{
    background:var(--bg-panel-3);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .sidebar-search{
    padding:12px 14px;border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:10px;
  }
  .search-box{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;align-items:center;gap:6px;padding:6px 9px;
  }
  .search-box input{background:none;border:none;outline:none;color:var(--text-primary);font-size:12px;width:100%;}
  .search-box svg{width:13px;height:13px;fill:none;stroke:var(--text-muted);stroke-width:2;flex-shrink:0;}
  .filter-tabs{display:flex;gap:6px;}
  .filter-tabs button{
    flex:1;background:var(--bg-panel);border:1px solid var(--line);color:var(--text-muted);
    font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:6px 4px;border-radius:var(--radius);
  }
  .filter-tabs button.active{background:var(--bg-panel-light);color:var(--text-bright);border-color:var(--accent-blue-dim);}

  .game-list{flex:1;overflow-y:auto;padding:6px 0;}
  .list-label{
    font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text-dim);
    padding:10px 14px 4px;
  }
  .list-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;cursor:pointer;
    border-left:3px solid transparent;
    position:relative;
  }
  .list-item:hover{background:var(--bg-panel-2);}
  .list-item.selected{background:var(--bg-panel-2);border-left-color:var(--accent-blue);}
  .list-icon{
    width:32px;height:32px;border-radius:3px;flex-shrink:0;
    background:linear-gradient(150deg,var(--c1,#2a3f5a),var(--c2,#101c26));
    border:1px solid var(--line);
  }
  .list-meta{min-width:0;flex:1;}
  .list-title{
    font-size:12.5px;font-weight:500;color:var(--text-primary);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .list-item.selected .list-title{color:var(--text-bright);}
  .list-sub{font-size:10.5px;color:var(--text-dim);}
  .playing-pip{width:7px;height:7px;border-radius:50%;background:var(--accent-green);flex-shrink:0;box-shadow:0 0 6px var(--accent-green);}

  /* ===== MAIN: GAME DETAIL ===== */
  .main{
    overflow-y:auto;
    background:var(--bg-deep);
  }
  .hero{
    position:relative;
    height:340px;
    background:
      linear-gradient(180deg, rgba(14,20,27,0) 0%, rgba(14,20,27,.4) 55%, rgba(14,20,27,1) 100%),
      radial-gradient(110% 90% at 30% 20%, #2f5a72 0%, #1c3345 45%, #0f1720 100%);
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, transparent 0 60px, rgba(102,192,244,.05) 60px 61px);
  }
  .hero-inner{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:32px 40px;
  }
  .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent-blue);text-transform:uppercase;margin-bottom:8px;}
  .hero-title{font-size:40px;line-height:1;margin-bottom:14px;}
  .hero-actions{display:flex;align-items:center;gap:12px;}
  .btn{
    border-radius:var(--radius);font-weight:700;font-size:13px;letter-spacing:.03em;
    padding:12px 26px;text-transform:uppercase;transition:filter .15s ease, transform .15s ease;
  }
  .btn:hover{filter:brightness(1.15);}
  .btn:active{transform:translateY(1px);}
  .btn-play{background:linear-gradient(90deg,#7fc93f,#a4d007);color:#132406;font-size:15px;padding:13px 34px;}
  .btn-icon{
    width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg-panel);border:1px solid var(--line);color:var(--text-muted);font-size:16px;
  }
  .btn-icon:hover{color:var(--text-bright);border-color:var(--accent-blue-dim);}
  .hero-stat{margin-left:auto;text-align:right;}
  .hero-stat .num{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--text-bright);font-weight:700;}
  .hero-stat .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}

  /* body sections */
  .body-pad{padding:28px 40px 60px;}
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .tabs button{
    background:none;color:var(--text-muted);font-size:12.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;padding:0 0 12px;
    border-bottom:2px solid transparent;
  }
  .tabs button.active{color:var(--text-bright);border-bottom-color:var(--accent-blue);}

  .stat-row{display:flex;gap:14px;margin-bottom:32px;flex-wrap:wrap;}
  .stat-card{
    flex:1;min-width:150px;
    background:var(--bg-panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat-card .num{font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--text-bright);font-weight:700;}
  .stat-card .lbl{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .bar-track{height:4px;background:var(--bg-panel-3);border-radius:2px;margin-top:10px;overflow:hidden;}
  .stat-card .bar-fill{height:100%;background:var(--accent-blue);}

  h3.section-title{font-size:13px;letter-spacing:.06em;color:var(--text-muted);margin-bottom:14px;}

  .screenshot-row{display:flex;gap:10px;overflow-x:auto;margin-bottom:36px;padding-bottom:6px;}
  .screenshot{
    flex:0 0 220px;height:124px;border-radius:var(--radius);
    background:linear-gradient(140deg,var(--c1,#2a3f5a),var(--c2,#101c26));
    border:1px solid var(--line);
  }

  .achv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:8px;}
  .achv{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;
  }
  .achv-icon{
    width:36px;height:36px;border-radius:3px;flex-shrink:0;
    background:linear-gradient(135deg,var(--bg-panel-light),var(--bg-panel-3));
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .achv.locked{opacity:.4;}
  .achv.locked .achv-icon{filter:grayscale(1);}
  .achv-name{font-size:12px;font-weight:600;color:var(--text-bright);}
  .achv-desc{font-size:10.5px;color:var(--text-dim);}
  .achv-pct{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent-gold);flex-shrink:0;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="logo"><span class="dot"></span>NEXUS</div>
    <div class="topnav">
      <a href="#">Tienda</a>
      <a class="active" href="#">Biblioteca</a>
      <a href="#">Comunidad</a>
      <a href="#">Perfil</a>
    </div>
    <div class="top-right">
      <div class="status"><span class="pip"></span>En línea</div>
      <div class="avatar"></div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-search">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 1 0-10.6 0 7.5 7.5 0 0 0 10.6 0z"/></svg>
        <input placeholder="Filtrar juegos...">
      </div>
      <div class="filter-tabs">
        <button class="active">Todos</button>
        <button>Instalados</button>
        <button>Favoritos</button>
      </div>
    </div>

    <div class="game-list" id="game-list"></div>
  </aside>

  <main class="main">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-eyebrow">Instalado · 42.8 GB</div>
        <h1 class="hero-title" id="detail-title">CIPHER PROTOCOL</h1>
        <div class="hero-actions">
          <button class="btn btn-play">▶ Jugar</button>
          <button class="btn btn-icon" title="Comunidad">👥</button>
          <button class="btn btn-icon" title="Ajustes">⚙</button>
          <button class="btn btn-icon" title="Más">⋯</button>
          <div class="hero-stat">
            <div class="num mono">86<span style="font-size:13px;color:var(--text-muted)">h</span></div>
            <div class="lbl">Jugadas</div>
          </div>
        </div>
      </div>
    </section>

    <div class="body-pad">
      <div class="tabs">
        <button class="active">Resumen</button>
        <button>Logros</button>
        <button>Capturas</button>
        <button>Guía comunitaria</button>
        <button>Notas de parche</button>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="num">86h 24m</div>
          <div class="lbl">Tiempo jugado</div>
        </div>
        <div class="stat-card">
          <div class="num">Ayer, 22:10</div>
          <div class="lbl">Última sesión</div>
        </div>
        <div class="stat-card">
          <div class="num">27 / 40</div>
          <div class="lbl">Logros — 68%</div>
          <div class="bar-track"><div class="bar-fill" style="width:68%"></div></div>
        </div>
        <div class="stat-card">
          <div class="num">v2.4.1</div>
          <div class="lbl">Versión instalada</div>
        </div>
      </div>

      <h3 class="section-title">Capturas recientes</h3>
      <div class="screenshot-row">
        <div class="screenshot" style="--c1:#2a3f5a;--c2:#101c26"></div>
        <div class="screenshot" style="--c1:#3a2a3a;--c2:#101c26"></div>
        <div class="screenshot" style="--c1:#3a5a4a;--c2:#101c26"></div>
        <div class="screenshot" style="--c1:#4a4a2a;--c2:#101c26"></div>
        <div class="screenshot" style="--c1:#2a4a5a;--c2:#101c26"></div>
      </div>

      <h3 class="section-title">Logros</h3>
      <div class="achv-grid" id="achv-grid"></div>
    </div>
  </main>

</div>

<script>
const owned = [
  ["Cipher Protocol","Sigilo · 86h","#2a3f5a","#101c26",true,true],
  ["Ashfall Chronicles","Estrategia · 34h","#3a5a3a","#101c26",true,false],
  ["Rustbelt Racers","Carreras · 12h","#5a3a4a","#101c26",false,false],
  ["Hollow Meridian","RPG · 210h","#3a4a5a","#101c26",true,false],
  ["Ferrywatch","Aventura · 4h","#5a5a3a","#101c26",false,false],
  ["Loop Garden","Puzzle · 61h","#4a3a5a","#101c26",true,false],
  ["Void Sentinel","Acción · 8h","#2a3f5a","#101c26",false,false],
  ["Marrow Hollow","Terror · 19h","#3a2a3a","#101c26",true,false],
  ["Kite & Compass","Relax · 2h","#3a5a4a","#101c26",false,false],
  ["Ironclad Frontier","4X · 145h","#4a4a2a","#101c26",true,false],
];

const listEl = document.getElementById('game-list');
listEl.innerHTML += `<div class="list-label">Biblioteca — ${owned.length} juegos</div>`;
owned.forEach((g, i)=>{
  const [title, sub, c1, c2, installed, playing] = g;
  const div = document.createElement('div');
  div.className = 'list-item' + (i===0 ? ' selected':'');
  div.innerHTML = `
    <div class="list-icon" style="--c1:${c1};--c2:${c2}"></div>
    <div class="list-meta">
      <div class="list-title">${title}</div>
      <div class="list-sub">${sub}</div>
    </div>
    ${playing ? '<div class="playing-pip"></div>' : ''}
  `;
  div.addEventListener('click', ()=>{
    document.querySelectorAll('.list-item').forEach(el=>el.classList.remove('selected'));
    div.classList.add('selected');
    document.getElementById('detail-title').textContent = title.toUpperCase();
  });
  listEl.appendChild(div);
});

const achievements = [
  ["Primera sangre","Completa la misión inicial","🎯",true,"94.2%"],
  ["Fantasma","Termina un nivel sin ser detectado","👻",true,"41.6%"],
  ["Manos limpias","Completa el juego sin matar a nadie","🕊️",true,"12.8%"],
  ["Velocista","Termina la campaña en menos de 6h","⏱️",false,"8.3%"],
  ["Coleccionista","Encuentra todos los archivos ocultos","🗂️",true,"29.4%"],
  ["Sin salida","Sobrevive la persecución final","🏃",false,"15.7%"],
];
const achvGrid = document.getElementById('achv-grid');
achievements.forEach(([name, desc, icon, unlocked, pct])=>{
  const div = document.createElement('div');
  div.className = 'achv' + (unlocked ? '' : ' locked');
  div.innerHTML = `
    <div class="achv-icon">${icon}</div>
    <div>
      <div class="achv-name">${name}</div>
      <div class="achv-desc">${desc}</div>
    </div>
    <div class="achv-pct">${pct}</div>
  `;
  achvGrid.appendChild(div);
});
</script>
</body>
</html>
