# clippy.toml — project-wide Clippy configuration

# Warn on large enum variants.
enum-variant-size-threshold = 200

# Warn on functions with too many arguments.
too-many-arguments-threshold = 6

# Warn on long type chains.
type-complexity-threshold = 200

# Warn on large stack-allocated values.
stack-size-threshold = 512

# Disallow verbose println in favor of eprintln or proper logging.
# (Enforced via lint level in lib.rs/main.rs — see below.)

# Single-letter names that read fine in their usual spots: sort/cmp closure
# params (a, b), a char in a parser loop (c), a short-lived key/result/error
# (k, r, e), a string being built up (s), and rust-i18n's `t!` macro (t).
allowed-idents-below-min-chars = ["a", "b", "c", "e", "k", "r", "s", "t"]

# Proper nouns doc_markdown would otherwise ask to wrap in backticks.
doc-valid-idents = [
    "GOG", "GOG's",
    "Steam", "Steam's",
    "Proton", "Proton's",
    "Wine", "Wine's",
    "GamesDB", "GamesDB's",
    "MangoHud", "MangoHud's",
    "GameMode", "GameMode's",
]