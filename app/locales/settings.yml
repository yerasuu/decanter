settings.general.language.title:
  es: Idioma
  en: Language
settings.general.language.system:
  es: El del sistema
  en: System default
settings.general.close.title:
  es: Al cerrar la ventana
  en: When closing the window
settings.general.close.to_tray:
  es: Mantener Decanter en ejecución en la bandeja en vez de cerrarlo
  en: Keep Decanter running in the tray instead of quitting
settings.general.close.restart_hint:
  es: Requiere reiniciar Decanter para que el cambio tenga efecto.
  en: Decanter has to be restarted for the change to take effect.
settings.general.close_game.title:
  es: Cerrar un juego
  en: Closing a game
settings.general.close_game.enabled:
  es: Cerrar el juego en marcha desde el mando o el teclado
  en: Close the running game from the controller or keyboard
settings.general.close_game.hint:
  es: "Mantén Select + Start %{hold} segundos en cualquier mando, o pulsa Ctrl+Mayús+F4 en Plasma (se cambia en Preferencias del sistema > Atajos > Decanter). Decanter avisa antes de cerrarlo; si repites la combinación en los %{grace} segundos siguientes, lo cancela. En los juegos de PS4, el botón Guide abre además el aviso de cierre del propio juego."
  en: "Hold Select + Start for %{hold} seconds on any controller, or press Ctrl+Shift+F4 on Plasma (change it in System Settings > Shortcuts > Decanter). Decanter warns before closing it; repeating the combination within the next %{grace} seconds cancels it. In PS4 games, the Guide button also opens the game's own close prompt."
settings.general.steam.title:
  es: Exportar a Steam
  en: Export to Steam
settings.general.steam.add:
  es: Añadir cada juego instalado a la biblioteca real de Steam, con su portada y su banner
  en: Add every installed game to Steam's own library, with its cover and banner
settings.general.steam.restart_hint:
  es: Hay que reiniciar Steam para ver los cambios — Steam solo lee sus accesos directos al arrancar.
  en: Steam has to be restarted to show the changes — it only reads its shortcuts at startup.
settings.general.steam.pending:
  es: Hay juegos exportados a Steam esperando a que se reinicie — Steam estaba abierto cuando se añadieron, así que su propia copia en memoria todavía no los ha sobrescrito.
  en: Some games exported to Steam are waiting for it to restart — Steam was open when they were added, so they're held back until then to keep its in-memory copy from overwriting them.
settings.general.steam.restarting:
  es: Reiniciando Steam...
  en: Restarting Steam...
settings.general.steam.restart_now:
  es: Reiniciar Steam ahora
  en: Restart Steam now
settings.general.steam.no_install:
  es: no se encontró una instalación de Steam
  en: no Steam installation was found
settings.general.steam.no_user:
  es: no se pudo resolver el usuario local de Steam
  en: could not resolve Steam's local user
settings.account.intro:
  es: Las cuentas de este perfil. Todas aportan a la Biblioteca a la vez — no hace falta elegir una activa.
  en: This profile's accounts. They all feed the Library at once — there's no need to pick an active one.
settings.account.empty:
  es: Todavía no hay ninguna cuenta en este perfil.
  en: This profile has no accounts yet.
settings.account.no_store:
  es: Sin tienda
  en: No store
settings.account.log_out:
  es: Cerrar sesión
  en: Log out
settings.account.session.checking:
  es: Comprobando sesión…
  en: Checking session…
settings.account.session.revoked:
  es: la sesión se cerró en GOG
  en: the session was closed on GOG
settings.account.session.invalid:
  es: "sesión inválida: %{error}"
  en: "invalid session: %{error}"
settings.account.add.button:
  es: + Añadir cuenta GOG
  en: + Add GOG account
settings.account.add.hint:
  es: Abre GOG, inicia sesión y pega aquí la dirección de la página a la que llegues.
  en: Open GOG, log in, and paste the address of the page you land on here.
settings.account.add.open:
  es: Abrir GOG
  en: Open GOG
settings.account.add.connect:
  es: Conectar
  en: Connect
settings.account.library.title:
  es: Ubicación de la biblioteca
  en: Library location
settings.account.library.unknown:
  es: desconocida
  en: unknown
settings.account.library.pick_title:
  es: Elige la nueva ubicación de la biblioteca
  en: Choose the library's new location
settings.account.library.change:
  es: Cambiar ubicación
  en: Change location
settings.account.library.moving:
