settings.compatibility.tools.title:
  es: Herramientas
  en: Tools
settings.compatibility.tools.intro:
  es: Decanter descarga su propia copia de umu-run y de nix-portable, en versiones fijas que solo cambia tras probarlas; umu descarga UMU-Proton por su cuenta cuando el Proton es automático.
  en: Decanter downloads its own copy of umu-run and nix-portable, at fixed versions it only changes after testing them; umu downloads UMU-Proton on its own when Proton is automatic.
settings.compatibility.tools.check:
  es: Buscar actualizaciones
  en: Check for updates
settings.compatibility.tools.checking:
  es: Comprobando…
  en: Checking…
