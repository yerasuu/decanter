  en: "UMU-Proton · the latest is %{tag}; umu will download it when a game launches with automatic Proton"
settings.compatibility.tools.proton.unpublished:
  es: UMU-Proton · el proyecto no tiene ninguna versión publicada
  en: UMU-Proton · the project has no published release
settings.compatibility.tools.proton.error:
  es: "UMU-Proton · %{error}"
  en: "UMU-Proton · %{error}"
settings.updates.install_errors.missing_appimage:
  es: "La versión %{tag} todavía no tiene AppImage en GitHub; vuelve a intentarlo dentro de un rato."
  en: "Version %{tag} has no AppImage on GitHub yet; try again in a while."
settings.updates.install_errors.unsigned:
  es: "La versión %{tag} todavía no está firmada; vuelve a intentarlo más tarde o descárgala a mano."
  en: "Version %{tag} isn't signed yet; try again later or download it by hand."
settings.updates.install_errors.download:
  es: "La descarga ha fallado: %{error}"
  en: "The download failed: %{error}"
settings.updates.install_errors.too_large:
  es: "La descarga supera los %{size}, más de lo que puede ocupar Decanter; no se ha instalado."
  en: "The download is over %{size}, more than Decanter can take up; it wasn't installed."
settings.updates.install_errors.bad_signature:
  es: La firma no corresponde a lo descargado. No se ha instalado nada y tu versión sigue igual.
  en: The signature doesn't match the download. Nothing was installed and your version is unchanged.
settings.updates.install_errors.wrong_key:
  es: La versión está firmada con una clave distinta de la de esta compilación. No se ha instalado nada.
  en: The version is signed with a different key than this build's. Nothing was installed.
settings.updates.install_errors.wrong_release:
  es: "La firma es de otra versión («%{found}»). No se ha instalado nada."
  en: "The signature belongs to another version (“%{found}”). Nothing was installed."
settings.updates.install_errors.no_permission:
  es: "No hay permiso para escribir en %{dir}. Mueve el AppImage a una carpeta tuya o descárgalo a mano."
  en: "No permission to write in %{dir}. Move the AppImage to a folder of yours or download it by hand."
settings.updates.install_errors.disk_full:
  es: "No queda espacio en %{dir}. Libera espacio y vuelve a intentarlo; tu versión sigue igual."
  en: "No space left in %{dir}. Free some space and try again; your version is unchanged."
settings.updates.install_errors.io:
  es: "No se ha podido escribir %{path}: %{error}"
  en: "Couldn't write %{path}: %{error}"
settings.updates.install_errors.broken_key:
  es: "La clave de firma de esta compilación no es válida: %{error}"
  en: "This build's signing key isn't valid: %{error}"
