  es: El del sistema
  en: System default
settings.general.close.title:
  es: Al cerrar la ventana
  en: When closing the window
settings.general.close.to_tray:
  es: Mantener Decanter en ejecución en la bandeja en vez de cerrarlo
  en: Keep Decanter running in the tray instead of quitting
settings.general.close.restart_hint:
  es: Requiere reiniciar Decanter para que el cambio tenga efecto.
  en: Decanter has to be restarted for the change to take effect.
settings.general.steam.title:
  es: Exportar a Steam
  en: Export to Steam
settings.general.steam.add:
  es: Añadir cada juego instalado a la biblioteca real de Steam, con su portada y su banner
  en: Add every installed game to Steam's own library, with its cover and banner
settings.general.steam.restart_hint:
  es: Hay que reiniciar Steam para ver los cambios — Steam solo lee sus accesos directos al arrancar.
  en: Steam has to be restarted to show the changes — it only reads its shortcuts at startup.
settings.general.steam.pending:
  es: Hay juegos exportados a Steam esperando a que se reinicie — Steam estaba abierto cuando se añadieron, así que su propia copia en memoria todavía no los ha sobrescrito.
  en: Some games exported to Steam are waiting for it to restart — Steam was open when they were added, so they're held back until then to keep its in-memory copy from overwriting them.
settings.general.steam.restarting:
  es: Reiniciando Steam...
  en: Restarting Steam...
settings.general.steam.restart_now:
  es: Reiniciar Steam ahora
  en: Restart Steam now
settings.general.steam.no_install:
  es: no se encontró una instalación de Steam
  en: no Steam installation was found
settings.general.steam.no_user:
  es: no se pudo resolver el usuario local de Steam
  en: could not resolve Steam's local user
settings.account.intro:
  es: Las cuentas de este perfil. Todas aportan a la Biblioteca a la vez — no hace falta elegir una activa.
  en: This profile's accounts. They all feed the Library at once — there's no need to pick an active one.
