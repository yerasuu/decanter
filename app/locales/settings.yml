  en: "%{tool} %{version} · %{latest} is out; Decanter will adopt it once it's tested"
settings.compatibility.tools.unpublished:
  es: "%{tool} %{version} · el proyecto no tiene ninguna versión publicada"
  en: "%{tool} %{version} · the project has no published release"
settings.compatibility.tools.error:
