  en: UMU-Proton · umu downloads the latest when a game launches with automatic Proton
settings.compatibility.tools.proton.installed:
  es: "UMU-Proton · %{tag} es la última y ya está descargada"
  en: "UMU-Proton · %{tag} is the latest and already downloaded"
settings.compatibility.tools.proton.pending:
