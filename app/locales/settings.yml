  en: Moving...
settings.account.library.moving_progress:
  es: "Moviendo... %{done} de %{total}"
  en: "Moving... %{done} of %{total}"
settings.account.library.active_title:
  es: Biblioteca activa
  en: Active library
settings.account.library.active_hint:
  es: Decanter trabaja con una biblioteca a la vez. Al cambiar, se abre con la última persona que la usó.
  en: Decanter works with one library at a time. Switching opens it with the person who used it last.
settings.account.library.busy:
  es: cierra antes los juegos y las instalaciones para cambiar de biblioteca
  en: close running games and installs before switching library
settings.account.library.no_profiles:
  es: esa biblioteca todavía no tiene ninguna persona
  en: that library has no people yet
settings.account.errors.browser:
  es: "no se pudo abrir el navegador: %{error}"
  en: "could not open the browser: %{error}"
settings.account.errors.db:
  es: no se pudo abrir la base de datos
  en: could not open the database
settings.account.errors.accounts:
  es: no se pudieron leer las cuentas del perfil
  en: could not read the profile's accounts
settings.account.errors.library:
  es: no se pudo resolver la biblioteca actual
  en: could not resolve the current library
settings.account.errors.locked:
  es: hay otra ventana de Decanter abierta — ciérrala antes de mover la biblioteca
  en: another Decanter window is open — close it before moving the library
settings.account.errors.busy:
  es: hay un juego de este perfil en ejecución o instalándose — ciérralo antes de mover la biblioteca
  en: a game from this profile is running or installing — close it before moving the library
settings.account.errors.save_path:
  es: "se movió, pero no se pudo guardar la nueva ruta: %{error}"
  en: "it was moved, but the new path could not be saved: %{error}"
settings.account.people.title:
  es: Personas
  en: People
settings.account.people.hint:
  es: Cada persona tiene sus propias cuentas, colecciones, partidas y trofeos. Cuando hay más de una, cambias de persona desde la barra superior.
  en: Each person has their own accounts, collections, saves and trophies. Once there's more than one, you switch person from the top bar.
settings.account.people.add:
  es: + Añadir persona
  en: + Add person
settings.compatibility.intro:
  es: Cada juego se ejecuta en su propio prefijo, creado la primera vez que lo abres. Para fijar un Proton distinto o restablecer el prefijo de un juego concreto, abre sus Propiedades desde la biblioteca.
  en: Each game runs in its own prefix, created the first time you open it. To pin a different Proton or reset a particular game's prefix, open its Properties from the library.
settings.compatibility.default:
  es: Proton por defecto
  en: Default Proton
settings.compatibility.automatic:
  es: Automático (lo resuelve umu)
  en: Automatic (resolved by umu)
settings.compatibility.none_installed:
  es: No hay Proton instalado en Steam (compatibilitytools.d). umu descargará uno la primera vez.
  en: No Proton is installed in Steam (compatibilitytools.d). umu will download one the first time.
settings.compatibility.game_tools.title:
  es: Herramientas de juego
  en: Game tools
settings.compatibility.game_tools.intro:
  es: Se aplican a los juegos de PC y de PS que no tienen una elección propia; cada juego puede cambiarla en sus Propiedades (PC) o en su Resumen (PS).
  en: They apply to PC and PS games without a choice of their own; each game can change it in its Properties (PC) or its Overview (PS).
settings.compatibility.game_tools.mangohud:
  es: Mostrar MangoHud (FPS, tiempos de fotograma, uso de CPU y GPU)
  en: Show MangoHud (FPS, frame times, CPU and GPU usage)
settings.compatibility.game_tools.mangohud_log:
  es: Registrar el rendimiento desde el inicio de cada partida con MangoHud
  en: Log performance from the start of every MangoHud run
settings.compatibility.game_tools.mangohud_log_hint:
  es: Los registros se guardan en decanter/logs/mangohud dentro de la biblioteca. Sin esta opción, empiezan y terminan con el atajo de MangoHud (Mayús izquierda + F2).
  en: Logs are saved in decanter/logs/mangohud inside the library. Without this option, they start and stop with MangoHud's shortcut (Left Shift + F2).
