ps.branch.title: Branche de psport, compilée sur ce PC (Test)
ps.branch.description: 'decanter récupère le dernier commit de la branche de psport avec votre git, télécharge la chaîne d’outils qu’il fixe (llvm-mingw, CMake, Ninja et le paquet de chaîne d’outils de psport, chacun vérifié par son SHA-256) et le compile ici, sans rien exécuter d’autre de ce qu’il télécharge. La compilation exécute les propres scripts de la branche avec vos droits : chaque nouveau commit demande donc d’abord votre confirmation. Une compilation est utilisée dès qu’elle se termine, et les compilations et versions précédentes sont supprimées avec leurs journaux.'
