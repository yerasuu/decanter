ps.settings.games.title: Dossier des jeux
ps.settings.games.description: À côté de chaque dossier de bibliothèque du profil, sur le même disque. « Ajouter un dump… », ou le dépôt de son dossier sur la fenêtre, copie ou déplace un dump dans le dossier principal, et les dumps de chaque dossier apparaissent d’eux-mêmes. Les sauvegardes et les paramètres restent toujours dans le dossier principal ; le cache va à l’emplacement de cache du dossier de chaque jeu. Pour déplacer un jeu entre des dossiers, ou choisir où va son cache, utilisez Stockage.
