settings.general.debug.title: Débogage
settings.general.debug.enabled: Mode débogage
settings.general.debug.hint: 'Decanter et psport conservent leurs journaux complets dans le dossier ci-dessous, dans un sous-dossier portant le nom de cet ordinateur, afin que vous puissiez le synchroniser avec vos autres ordinateurs. Chaque fichier apparaît une fois terminé. Les jeux ne changent pas : seuls l’emplacement et la quantité de journalisation changent.'
settings.general.debug.app_log_next_start: Les exécutions et les tâches y sont conservées dès maintenant ; le journal propre à l’application démarrera à la prochaine ouverture de Decanter.
settings.general.debug.app_log_until_exit: Le journal de l’application de cette session continue d’y être écrit jusqu’à la fermeture de Decanter.
settings.general.debug.folder: Dossier des journaux de débogage
settings.general.debug.folder_default: Dans la bibliothèque
settings.general.debug.folder_chosen: Choisi par vous
settings.general.debug.folder_scrubbed: Les copies de Decanter ici omettent les mots de passe, les jetons et la partie requête des adresses web ; les noms de jeux, les chemins et les identifiants restent. La bibliothèque conserve les journaux complets. Ce que psport écrit lui-même ici (gpu.log, faults.txt, config.txt) n’est pas nettoyé.
