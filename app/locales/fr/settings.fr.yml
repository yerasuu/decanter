settings.general.close.title: À la fermeture de la fenêtre
settings.general.close.to_tray: Laisser Decanter actif dans la zone de notification au lieu de quitter
settings.general.close.restart_hint: Decanter doit être redémarré pour que le changement prenne effet.
settings.general.close_game.title: Fermeture d’un jeu
settings.general.close_game.enabled: Fermer le jeu en cours depuis la manette ou le clavier
settings.general.close_game.hint: Maintenez Select + Start pendant %{hold} secondes sur n’importe quelle manette, ou appuyez sur Ctrl+Maj+F4 sous Plasma (modifiable dans Configuration du système > Raccourcis > Decanter). Decanter prévient avant de le fermer ; répéter la combinaison dans les %{grace} secondes suivantes annule la fermeture. Dans les jeux PS4, le bouton Guide ouvre aussi la demande de fermeture propre au jeu.
settings.general.close_game.enabled_keyboard: Fermer le jeu en cours avec un raccourci clavier
settings.general.close_game.hint_keyboard: Appuyez sur Ctrl+Maj+F4 pendant que vous jouez. Decanter ferme le jeu %{grace} secondes plus tard ; appuyer de nouveau avant l’annule.
settings.general.steam.title: Exporter vers Steam
settings.general.steam.add: Ajouter chaque jeu installé à la propre bibliothèque de Steam, avec sa jaquette et sa bannière
settings.general.steam.restart_hint: Steam doit être redémarré pour afficher les changements — il ne lit ses raccourcis qu’au démarrage.
settings.general.downloads.title: Téléchargements
settings.general.downloads.resume_on_start: Reprendre les téléchargements à l’ouverture de Decanter
settings.general.downloads.resume_hint: Ceux arrêtés par la fermeture de Decanter ou par une sortie inattendue. Ceux que vous avez mis en pause attendent que vous les repreniez, et ceux arrêtés par le réseau ou par un disque débranché reprennent seuls à son retour.
settings.general.raven.title: Raven (expérimental)
settings.general.raven.enable: Afficher la section Raven
settings.general.raven.hint: Raven est un environnement d’exécution Windows à un stade précoce. Avec la section activée, vous pouvez le compiler dans votre bibliothèque et y essayer des programmes Windows ; rien n’est téléchargé et GitHub n’est pas contacté tant que vous n’appuyez pas sur Compiler ou Rechercher des mises à jour dans la section.
settings.general.steam.pending: Certains jeux exportés vers Steam attendent son redémarrage — Steam était ouvert lors de leur ajout, ils sont donc retenus jusque-là pour que sa copie en mémoire ne les écrase pas.
settings.general.steam.restarting: Redémarrage de Steam…
settings.general.steam.restart_now: Redémarrer Steam maintenant
settings.general.steam.close_first: decanter ne peut pas savoir d’ici si Steam est ouvert. Fermez Steam et confirmez pour appliquer les changements ; decanter le relancera ensuite.
settings.general.steam.apply_closed: Steam est fermé, appliquer
