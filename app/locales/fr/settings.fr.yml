settings.account.people.title: Personnes
settings.account.people.hint: Chaque personne a ses propres comptes, collections, sauvegardes et trophées. Dès qu’il y en a plus d’une, vous changez de personne depuis la barre du haut.
settings.account.people.add: + Ajouter une personne
settings.compatibility.intro: Chaque jeu s’exécute dans son propre préfixe, créé la première fois que vous l’ouvrez. Pour fixer un autre Proton ou réinitialiser le préfixe d’un jeu en particulier, ouvrez ses Propriétés depuis la bibliothèque.
settings.compatibility.default: Proton par défaut
settings.compatibility.automatic: Automatique (résolu par umu)
settings.compatibility.none_installed: Aucun Proton n’est installé dans Steam (compatibilitytools.d). umu en téléchargera un la première fois.
settings.compatibility.game_tools.title: Outils de jeu
settings.compatibility.game_tools.intro: Ils s’appliquent aux jeux PC et PS sans choix propre ; chaque jeu peut le modifier dans ses Propriétés (PC) ou son Aperçu (PS).
settings.compatibility.game_tools.mangohud: Afficher MangoHud (FPS, temps d’image, utilisation du CPU et du GPU)
settings.compatibility.game_tools.mangohud_log: Enregistrer les performances dès le début de chaque exécution de MangoHud
settings.compatibility.game_tools.mangohud_log_hint: Les journaux sont enregistrés dans decanter/logs/mangohud à l’intérieur de la bibliothèque. Sans cette option, ils démarrent et s’arrêtent avec le raccourci de MangoHud (Maj gauche + F2).
settings.compatibility.game_tools.gamemode: Activer GameMode pendant le jeu
settings.compatibility.game_tools.gamemode_hint: GameMode fait passer le CPU en mode performance et applique le reste de votre gamemode.ini jusqu’à la fermeture du jeu.
