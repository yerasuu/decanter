raven.experimental: Expérimental
raven.description: 'Raven est un environnement d’exécution Windows pour Linux à un stade précoce (useraven.org). decanter le compile dans votre bibliothèque à partir d’un commit fixé, ou du dernier commit de sa branche si vous le demandez, et l’utilise pour les programmes Windows que vous ajoutez ici. Beaucoup de programmes ne démarrent pas encore : pour l’instant, il est là pour être essayé.'
raven.license: Raven est un logiciel libre (GPL-3.0 ou ultérieure). Il n’est pas fourni avec decanter ; son code est téléchargé depuis GitHub lors de la compilation.
