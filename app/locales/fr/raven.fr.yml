raven.confirm.commit: 'Commit : %{commit}'
raven.confirm.text: decanter va télécharger depuis GitHub le code de Raven à ce commit (environ 18 Mo), les bibliothèques nécessaires à sa compilation (depuis Nix, si votre système ne les a pas) et les données que sa compilation télécharge, puis le compiler dans votre bibliothèque. Cela prend quelques minutes. Le dossier de compilation occupe jusqu’à environ 5 Go et l’environnement d’exécution environ 140 Mo. C’est du code tiers que decanter ne vérifie pas.
