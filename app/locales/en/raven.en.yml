raven.confirm.text: 'decanter will download Raven''s code at this commit from GitHub (about 18 MB), the libraries it needs to build (from Nix, if your system lacks them) and the data its build downloads, and compile it in your library. It takes a few minutes. The build folder takes up to about 5 GB and the runtime about 140 MB. It is third-party code that decanter does not review.'
