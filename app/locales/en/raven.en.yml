raven.confirm.text: 'decanter will download Raven''s code at this commit from GitHub (about 7 MB), the tools it needs to build, the 64-bit and 32-bit MinGW compilers and the Clang compiler among them (from Nix, if your system lacks them; Clang adds about 150 MB to download), the data its build downloads (about 15 MB), for the installer components the source code of zlib (zlib.net), libjpeg (ijg.org), LibTIFF (download.osgeo.org), libxml2 and libxslt (download.gnome.org), about 11 MB, and, for text in program windows, the Liberation fonts (from Ubuntu''s archive, archive.ubuntu.com) and the DejaVu fonts (from the DejaVu project on GitHub), about 7 MB, each from its official site and checked against its pinned hash, and the source code of the Skia graphics library at a pinned commit (skia.googlesource.com, about 80 MB). It will compile Raven in your library together with the components Windows programs need, built from Raven''s own sources and those libraries: its runtime library, the C runtime, the common controls, the Windows Installer services (msi, cabinet, rpcrt4, msxml3 and others) and the text drawing that windows and dialogs use (Skia with those fonts), for 64-bit and 32-bit programs. It takes about 7 minutes on a fast machine, longer on a slower one. The build folder takes about 1.5 GB and the runtime about 200 MB. It will also download Microsoft''s code signing root certificates from Microsoft''s public repository (microsoft.com/pki, a few KB), each checked against its pinned hash, so that installers can verify Microsoft signatures; by downloading them you accept Microsoft''s PKI Services Relying Party Agreement (linked below). It is third-party code that decanter does not review.'
