raven.experimental: Experimental
raven.description: 'Raven is an early-stage Windows runtime for Linux (useraven.org). decanter builds it in your library from a pinned commit, or from the newest commit of its branch when you ask for it, and uses it for the Windows programs you add here. Many programs do not start yet: for now it is here to try it out.'
raven.license: Raven is free software (GPL-3.0 or later). It does not ship with decanter; its code is downloaded from GitHub when it is built.
