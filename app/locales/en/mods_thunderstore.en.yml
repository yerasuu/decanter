mods.thunderstore.layout_note: 'With BepInEx, plugins, patchers, config and monomod go under the game''s BepInEx folder, and a package without them into BepInEx/plugins/<Team-Name>. This follows the r2modman mod manager''s convention; a package that fits no rule is added like any archive.'
