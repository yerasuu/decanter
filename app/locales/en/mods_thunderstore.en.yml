mods.thunderstore.note: 'Thunderstore needs no account. decanter asks it only when you act here, keeps its lists in the library for a few hours, and adds each package through the same checks as an archive. Thunderstore publishes no terms for its API: if it changes, decanter says so instead of guessing.'
