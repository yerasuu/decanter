settings.account.people.title: People
settings.account.people.hint: Each person has their own accounts, collections, saves and trophies. Once there's more than one, you switch person from the top bar.
settings.account.people.add: + Add person
settings.compatibility.intro: Each game runs in its own prefix, created the first time you open it. To pin a different Proton or reset a particular game's prefix, open its Properties from the library.
settings.compatibility.default: Default Proton
settings.compatibility.automatic: Automatic (resolved by umu)
settings.compatibility.none_installed: No Proton is installed in Steam (compatibilitytools.d). umu will download one the first time.
settings.compatibility.game_tools.title: Game tools
settings.compatibility.game_tools.intro: They apply to PC and PS games without a choice of their own; each game can change it in its Properties (PC) or its Overview (PS).
settings.compatibility.game_tools.mangohud: Show MangoHud (FPS, frame times, CPU and GPU usage)
settings.compatibility.game_tools.mangohud_log: Log performance from the start of every MangoHud run
settings.compatibility.game_tools.mangohud_log_hint: Logs are saved in decanter/logs/mangohud inside the library. Without this option, they start and stop with MangoHud's shortcut (Left Shift + F2).
settings.compatibility.game_tools.gamemode: Turn GameMode on while playing
settings.compatibility.game_tools.gamemode_hint: GameMode switches the CPU to performance and applies the rest of your gamemode.ini until the game closes.
