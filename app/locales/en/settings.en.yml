settings.general.debug.title: Debugging
settings.general.debug.enabled: Debug mode
settings.general.debug.hint: 'Decanter and psport keep their full logs in the folder below, inside a subfolder named after this computer, so you can sync it with your other computers. Each file shows up once it''s complete. Games don''t change: only where and how much gets logged.'
settings.general.debug.app_log_next_start: Runs and jobs are kept there from now on; the app's own log starts the next time you open Decanter.
settings.general.debug.app_log_until_exit: This session's app log keeps going there until you close Decanter.
