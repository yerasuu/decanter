settings.general.debug.folder_scrubbed: 'Decanter''s copies here leave out passwords, tokens and the query part of web addresses; game names, paths and ids stay. The library keeps the full logs. What psport writes here itself (gpu.log, faults.txt, config.txt) isn''t cleaned.'
