ps.settings.games.title: Games folder
ps.settings.games.description: 'Next to each of the profile''s library folders, on the same disk. "Add dump…", or dropping its folder on the window, copies or moves a dump into the main one, and the dumps of each folder show up on their own. Saves and settings always stay in the main one; the cache goes to the cache location of each game''s folder. To move a game between folders, or choose where its cache goes, use Storage.'
ps.settings.sys_modules.title: System modules (optional)
ps.settings.sys_modules.none: No folder
ps.settings.sys_modules.description: 'Optional: no game needs it today. A folder with your own dump of the console''s modules (*.sprx, like libSceNgs2.sprx), only to compare against the port''s own libraries (PS_LLE) or for a game that still needs a console module. Each game picks whether to load it in Graphics › Extras; by default every game but Bloodborne does. decanter neither ships nor copies any.'
ps.settings.psport_folder.title: psport.exe folder
ps.settings.psport_folder.none: No folder
ps.settings.psport_folder.pick_title: Folder holding psport.exe
ps.settings.psport_folder.description: 'Optional: a folder where you unpacked a psport build for Windows yourself, holding psport.exe and libpsport-gpu.dll. While one is chosen, Jugar starts its psport.exe directly instead of the version downloaded in Ports; forget it to go back to that one.'
