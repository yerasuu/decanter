ps.branch.title: psport's branch, built on this PC (Testing)
ps.branch.description: 'decanter fetches the newest commit of psport''s branch with your git, downloads the toolchain it pins (llvm-mingw, CMake, Ninja and psport''s toolchain package, each checked against its SHA-256) and builds it here, with nothing else running from what it downloads. Building runs the branch''s own scripts with your rights, so each new commit asks for your confirmation first.'
