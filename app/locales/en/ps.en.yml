ps.package.title: psport for Windows
ps.package.description: 'Each tagged psport release carries its Windows package: decanter downloads it, checks it against the release''s checksum and size, and keeps it in the library. Jugar runs the version in use, which follows the newest release unless you choose another. Only the version or build in use stays: once another is in use, decanter removes the rest.'
