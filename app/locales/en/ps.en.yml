ps.settings.games.title: Games folder
ps.settings.games.description: 'Next to each of the profile''s library folders, on the same disk. Copy or move your dumps there and they show up on their own: each folder and its direct subfolders are read as they are. Saves and settings always stay in the main one; the cache goes to the cache location of each game''s folder. To move a game between folders, or choose where its cache goes, use Storage.'
