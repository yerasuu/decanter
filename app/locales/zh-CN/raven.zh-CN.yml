raven.experimental: "实验性"
raven.description: "Raven 是面向 Linux 的早期 Windows 运行时（useraven.org）。decanter 会在您的游戏库中从固定的提交构建它，或在您要求时从其分支的最新提交构建，并用它运行您在此添加的 Windows 程序。许多程序目前还无法启动：现阶段仅供试用。"
raven.license: "Raven 是自由软件（GPL-3.0 或更高版本）。它不随 decanter 一同发布；其代码在构建时从 GitHub 下载。"
