raven.confirm.title: "构建 Raven？"
raven.confirm.repo: "仓库：%{repo}"
raven.confirm.commit: "提交：%{commit}"
raven.confirm.text: "decanter 将从 GitHub 下载此提交的 Raven 代码（约 7 MB）、构建所需的工具（包括 64 位和 32 位 MinGW 编译器以及 Clang 编译器；若系统缺少，则从 Nix 获取，Clang 约需额外下载 150 MB）、构建过程中下载的数据（约 15 MB）、安装程序组件所需的 zlib（zlib.net）、libjpeg（ijg.org）、LibTIFF（download.osgeo.org）、libxml2 和 libxslt（download.gnome.org）源代码（约 11 MB），以及程序窗口文字显示所需的 Liberation 字体（来自 Ubuntu 软件仓库 archive.ubuntu.com）和 DejaVu 字体（来自 GitHub 上的 DejaVu 项目）（约 7 MB），均从官方网站下载并按固定的哈希校验，还会下载固定提交的 Skia 图形库源代码（skia.googlesource.com，约 80 MB），并在您的游戏库中编译，同时用 Raven 自身的源代码和这些库构建 Windows 程序所需的组件：其运行时库、C 运行时、通用控件、Windows Installer 服务（msi、cabinet、rpcrt4、msxml3 等）以及窗口和对话框使用的文字绘制（使用这些字体的 Skia），适用于 64 位和 32 位程序。在较快的机器上约需 7 分钟，较慢的机器上更久。构建文件夹约占用 1.5 GB，运行时约 200 MB。此外还会从 Microsoft 的公共存储库（microsoft.com/pki，数 KB）下载 Microsoft 代码签名根证书，并逐一按固定的哈希校验，以便安装程序验证 Microsoft 的签名；下载这些证书即表示您接受 Microsoft PKI Services 的 Relying Party Agreement（见下方链接）。这是第三方代码，decanter 不会对其进行审查。"
