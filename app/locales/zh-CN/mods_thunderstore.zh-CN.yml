mods.thunderstore.note: 'Thunderstore 无需账户。decanter 只在你在此操作时向它请求，将它的列表在库中保存数小时，并以与压缩包相同的检查添加每个包。Thunderstore 未公布其 API 的使用条款：如有变化，decanter 会直接说明而不是猜测。'
