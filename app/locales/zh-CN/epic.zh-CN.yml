epic.consent.title: "登录 Epic Games 之前"
epic.consent.launcher: "为了登录，Decanter 会以官方 Epic Games 启动器的身份向 Epic 表明自己，并使用该启动器自己的客户端 ID。"
epic.consent.storage: "Decanter 只把会话保存在系统的密钥存储中，不保存其他任何内容。"
epic.consent.risk: "Epic 没有发布任何允许第三方客户端的许可，因此可能会限制或封禁你的账户。"
epic.consent.affiliation: "Decanter 与 Epic Games 没有任何关联。"
epic.consent.logout: "在这里退出登录只会从这台电脑上删除会话，不会通知 Epic。"
epic.consent.accept: "接受并继续"
epic.login.button: "登录 Epic Games"
epic.login.hint: "打开 Epic Games 并登录。最后的页面会显示一段包含 authorizationCode 的短文本：全部复制或只复制代码，然后粘贴到这里。"
epic.login.open: "打开 Epic Games"
epic.login.connect: "连接"
epic.session.closed: "会话已在 Epic Games 关闭。请重新登录。"
epic.credentials.kind: "Epic Games 会话"
epic.credentials.confirm: "%{subject} 的 Epic Games 会话将从钥匙串中移除。这会让该账户退出登录：要使用它，你需要重新登录。"
