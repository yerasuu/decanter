ps.settings.games.title: Spieleordner
ps.settings.games.description: 'Neben jedem Bibliotheksordner des Profils, auf demselben Datenträger. „Dump hinzufügen…“ oder das Ablegen seines Ordners auf dem Fenster kopiert oder verschiebt einen Dump in den Hauptordner, und die Dumps jedes Ordners erscheinen von selbst. Spielstände und Einstellungen bleiben immer im Hauptordner; der Cache geht an den Cache-Ort des Ordners jedes Spiels. Um ein Spiel zwischen Ordnern zu verschieben oder den Ort seines Caches zu wählen, nutze Speicher.'
