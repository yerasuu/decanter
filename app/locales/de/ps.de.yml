ps.branch.title: Branch von psport, auf diesem PC gebaut (Testing)
ps.branch.description: 'decanter holt mit deinem git den neuesten Commit des psport-Branches, lädt die Toolchain herunter, die er festlegt (llvm-mingw, CMake, Ninja und das Toolchain-Paket von psport, jedes anhand seines SHA-256 geprüft), und baut ihn hier, ohne dass etwas von dem Heruntergeladenen sonst ausgeführt wird. Beim Bauen laufen die eigenen Skripte des Branches mit deinen Rechten, daher fragt jeder neue Commit zuerst nach deiner Bestätigung. Ein Build ist sofort nach seinem Ende in Verwendung, und die Builds und Versionen davor werden samt ihren Protokollen entfernt.'
