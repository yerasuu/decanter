ps.settings.sys_modules.none: Kein Ordner
ps.settings.sys_modules.description: 'Optional: Kein Spiel braucht es derzeit. Ein Ordner mit deinem eigenen Dump der Konsolenmodule (*.sprx, etwa libSceNgs2.sprx), nur zum Vergleich mit den eigenen Bibliotheken des Ports (PS_LLE) oder für ein Spiel, das noch ein Konsolenmodul braucht. Jedes Spiel wählt unter Grafik › Extras, ob es geladen wird; standardmäßig tun das alle außer Bloodborne. decanter liefert keine mit und kopiert auch keine.'
