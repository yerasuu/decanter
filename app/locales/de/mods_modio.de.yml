mods.modio.note: 'mod.io funktioniert mit deinem eigenen API-Schlüssel (Einstellungen › Allgemein). decanter fragt mod.io nur, wenn du hier etwas tust, höchstens eine Anfrage alle anderthalb Sekunden, und fügt jede Datei mit denselben Prüfungen wie ein Archiv hinzu. Nur Spiele, die Drittanbieter-Apps auf mod.io erlauben, lassen sich nutzen.'
