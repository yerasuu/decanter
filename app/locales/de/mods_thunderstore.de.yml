mods.thunderstore.note: 'Thunderstore braucht kein Konto. decanter fragt es nur, wenn du hier etwas tust, hält seine Listen einige Stunden in der Bibliothek und fügt jedes Paket mit denselben Prüfungen wie ein Archiv hinzu. Thunderstore veröffentlicht keine Bedingungen für seine API: Ändert sie sich, sagt decanter das, statt zu raten.'
