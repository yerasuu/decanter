settings.general.close_game.title: Spiel beenden
settings.general.close_game.enabled: Laufendes Spiel per Controller oder Tastatur beenden
settings.general.close_game.hint: Halte auf einem beliebigen Controller %{hold} Sekunden lang Select + Start gedrückt oder drücke unter Plasma Strg+Umschalt+F4 (änderbar unter Systemeinstellungen > Kurzbefehle > Decanter). Decanter warnt vor dem Beenden; wiederholst du die Kombination in den nächsten %{grace} Sekunden, wird es abgebrochen. In PS4-Spielen öffnet die Guide-Taste außerdem die spieleigene Beenden-Abfrage.
settings.general.close_game.enabled_keyboard: Laufendes Spiel mit einem Tastenkürzel beenden
settings.general.close_game.hint_keyboard: Drücke beim Spielen Strg+Umschalt+F4. Decanter beendet das Spiel %{grace} Sekunden später; drückst du es vorher noch einmal, wird es abgebrochen.
settings.general.steam.title: Nach Steam exportieren
settings.general.steam.add: Alle installierten Spiele mit Cover und Banner zu Steams eigener Bibliothek hinzufügen
settings.general.steam.restart_hint: Steam muss neu gestartet werden, damit die Änderungen sichtbar werden — es liest seine Verknüpfungen nur beim Start.
settings.general.downloads.title: Downloads
settings.general.downloads.resume_on_start: Downloads beim Start von Decanter fortsetzen
settings.general.downloads.resume_hint: 'Gemeint sind Downloads, die durch das Schließen von Decanter oder ein unerwartetes Beenden gestoppt wurden. Von dir pausierte Downloads warten, bis du sie fortsetzt; durch das Netzwerk oder einen abgezogenen Datenträger gestoppte werden von selbst fortgesetzt, sobald es wieder klappt.'
settings.general.raven.title: Raven (experimentell)
settings.general.raven.enable: Raven-Bereich anzeigen
settings.general.raven.hint: 'Raven ist eine Windows-Laufzeit in einem frühen Stadium. Mit eingeschaltetem Bereich kannst du sie in deiner Bibliothek bauen und Windows-Programme damit ausprobieren; es wird nichts heruntergeladen und GitHub nicht kontaktiert, bis du im Bereich auf Bauen oder Nach Updates suchen drückst.'
settings.general.steam.pending: Einige nach Steam exportierte Spiele warten auf dessen Neustart — Steam war beim Hinzufügen geöffnet, daher werden sie zurückgehalten, damit seine Kopie im Arbeitsspeicher sie nicht überschreibt.
