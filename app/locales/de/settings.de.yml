settings.compatibility.intro: Jedes Spiel läuft in einem eigenen Prefix, das beim ersten Öffnen erstellt wird. Um ein anderes Proton festzulegen oder das Prefix eines Spiels zurückzusetzen, öffne seine Eigenschaften in der Bibliothek.
settings.compatibility.default: Standard-Proton
settings.compatibility.automatic: Automatisch (von umu bestimmt)
settings.compatibility.none_installed: In Steam ist kein Proton installiert (compatibilitytools.d). umu lädt beim ersten Mal eines herunter.
settings.compatibility.game_tools.title: Spiel-Tools
settings.compatibility.game_tools.intro: Sie gelten für PC- und PS-Spiele ohne eigene Wahl; jedes Spiel kann sie in seinen Eigenschaften (PC) oder seiner Übersicht (PS) ändern.
settings.compatibility.game_tools.mangohud: MangoHud anzeigen (FPS, Frametimes, CPU- und GPU-Auslastung)
settings.compatibility.game_tools.mangohud_log: Leistung ab dem Start jedes MangoHud-Laufs protokollieren
settings.compatibility.game_tools.mangohud_log_hint: Die Protokolle liegen in decanter/logs/mangohud in der Bibliothek. Ohne diese Option starten und stoppen sie mit dem MangoHud-Kürzel (Linke Umschalttaste + F2).
settings.compatibility.game_tools.gamemode: GameMode beim Spielen einschalten
settings.compatibility.game_tools.gamemode_hint: GameMode schaltet die CPU auf Leistung und wendet den Rest deiner gamemode.ini an, bis das Spiel beendet wird.
