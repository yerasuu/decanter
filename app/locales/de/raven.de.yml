raven.experimental: Experimentell
raven.description: 'Raven ist eine frühe Windows-Laufzeit für Linux (useraven.org). decanter baut sie in deiner Bibliothek aus einem festgelegten Commit oder, auf Wunsch, aus dem neuesten Commit ihres Branches und nutzt sie für die Windows-Programme, die du hier hinzufügst. Viele Programme starten noch nicht: Vorerst ist sie zum Ausprobieren da.'
raven.license: Raven ist freie Software (GPL-3.0 oder neuer). Sie wird nicht mit decanter ausgeliefert; ihr Code wird beim Bauen von GitHub heruntergeladen.
