raven.confirm.text: 'decanter lädt den Code von Raven in diesem Commit von GitHub herunter (etwa 18 MB), dazu die zum Bauen nötigen Bibliotheken (aus Nix, falls dein System sie nicht hat) und die Daten, die der Build herunterlädt, und kompiliert ihn in deiner Bibliothek. Das dauert einige Minuten. Der Build-Ordner belegt bis zu etwa 5 GB und die Laufzeit etwa 140 MB. Es ist Code von Dritten, den decanter nicht prüft.'
