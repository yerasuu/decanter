mods.thunderstore.note: 'O Thunderstore não precisa de conta. O decanter só o consulta quando você age aqui, guarda as listas dele na biblioteca por algumas horas e adiciona cada pacote com as mesmas verificações de um arquivo compactado. O Thunderstore não publica termos para a API: se ela mudar, o decanter avisa em vez de adivinhar.'
