settings.general.galaxy.title: 'Serviço local do Galaxy'
settings.general.galaxy.service: 'Registrar localmente as conquistas e estatísticas dos jogos da GOG'
settings.general.galaxy.service_hint: 'Jogos feitos com o GOG Galaxy conversam com um pequeno serviço que o Decanter executa só neste computador, enquanto eles rodam, e que registra conquistas, estatísticas e tempo de jogo. Desative se um jogo funcionar mal com ele ou se você usar ao mesmo tempo o cliente real do GOG Galaxy.'
