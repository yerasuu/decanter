settings.compatibility.game_tools.mangohud_log_hint: Os registros são salvos em decanter/logs/mangohud dentro da biblioteca. Sem esta opção, eles começam e param com o atalho do MangoHud (Shift Esquerdo + F2).
settings.compatibility.game_tools.gamemode: Ativar o GameMode durante o jogo
settings.compatibility.game_tools.gamemode_hint: O GameMode coloca a CPU em desempenho e aplica o resto do seu gamemode.ini até o jogo fechar.
