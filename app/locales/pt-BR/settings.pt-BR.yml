settings.compatibility.game_tools.title: Ferramentas de jogo
settings.compatibility.game_tools.intro: 'Elas valem para jogos de PC e PS sem uma escolha própria; cada jogo pode alterá-las nas Propriedades (PC) ou na Visão geral (PS).'
