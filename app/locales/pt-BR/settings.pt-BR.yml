settings.general.steam.title: "Steam"
settings.general.steam.compat: "Integração com a Steam"
settings.general.steam.compat_hint: "Desativada, o decanter não muda nada na Steam por conta própria; Adicionar à Steam e Adicionar pela Steam continuam funcionando."
settings.general.steam.register: "Compartilhar as pastas de biblioteca do decanter com a Steam"
settings.general.steam.register_hint: "Assim a Steam também pode instalar jogos nelas. Desativada, as pastas que o decanter adicionou à Steam são retiradas."
settings.general.steam.add: "Adicionar os jogos do decanter à Steam como atalhos"
settings.general.steam.restart_hint: "Cada jogo instalado recebe capa e banner. A Steam só lê seus atalhos ao iniciar, então reinicie-a para ver as alterações."
settings.general.steam.discover: "Mostrar os jogos e pastas da Steam no decanter"
settings.general.steam.discover_hint: "Verificado quando o decanter abre e a cada visita a Armazenamento, então cartões SD e discos são detectados assim que conectados. Desativada, os jogos da Steam e as pastas de biblioteca que ela trouxe são removidos do decanter; nenhum arquivo de jogo é tocado."
settings.general.downloads.title: Downloads
settings.general.downloads.resume_on_start: Retomar downloads quando o Decanter abrir
settings.general.downloads.resume_hint: 'Os interrompidos ao fechar o Decanter ou por uma saída inesperada. Os que você pausou esperam você retomá-los, e os interrompidos pela rede ou por um disco desconectado continuam sozinhos quando ela ou ele voltar.'
settings.general.raven.title: Raven (experimental)
settings.general.raven.enable: Mostrar a seção do Raven
settings.general.raven.hint: 'O Raven é um runtime de Windows em estágio inicial. Com a seção ativada, você pode compilá-lo na sua biblioteca e experimentar programas do Windows com ele; nada é baixado e o GitHub não é contatado até você pressionar Compilar ou Verificar atualizações na seção.'
settings.general.steam.pending: "Algumas alterações para a Steam (jogos exportados ou pastas de biblioteca) estão esperando que ela seja reiniciada — a Steam estava aberta quando elas foram feitas, então ficam retidas até lá para impedir que a cópia dela na memória as sobrescreva."
settings.general.steam.restarting: Reiniciando a Steam...
settings.general.steam.restart_now: Reiniciar a Steam agora
settings.general.steam.close_first: 'O decanter não consegue saber daqui se a Steam está aberta. Feche a Steam e confirme para aplicar as alterações; o decanter vai iniciá-la de novo depois.'
settings.general.steam.apply_closed: A Steam está fechada, aplicar
