settings.general.close_game.hint: 'Segure Select + Start por %{hold} segundos em qualquer controle, ou pressione Ctrl+Shift+F4 no Plasma (altere em Configurações do Sistema > Atalhos > Decanter). O Decanter avisa antes de fechá-lo; repetir a combinação nos %{grace} segundos seguintes cancela o fechamento. Em jogos de PS4, o botão Guide também abre o próprio aviso de fechamento do jogo.'
