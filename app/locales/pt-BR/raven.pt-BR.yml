raven.experimental: Experimental
raven.description: 'O Raven é um runtime de Windows para Linux em estágio inicial (useraven.org). O decanter o compila na sua biblioteca a partir de um commit fixo, ou do commit mais recente do branch dele quando você pedir, e o usa para os programas do Windows que você adicionar aqui. Muitos programas ainda não iniciam: por enquanto ele está aqui para você experimentar.'
raven.license: 'O Raven é software livre (GPL-3.0 ou posterior). Ele não vem com o decanter; o código dele é baixado do GitHub quando é compilado.'
