raven.confirm.text: 'O decanter vai baixar do GitHub o código do Raven neste commit (cerca de 18 MB), as bibliotecas necessárias para compilá-lo (do Nix, se o seu sistema não as tiver) e os dados que a compilação baixa, e vai compilá-lo na sua biblioteca. Leva alguns minutos. A pasta de compilação ocupa até cerca de 5 GB e o runtime cerca de 140 MB. É código de terceiros que o decanter não revisa.'
