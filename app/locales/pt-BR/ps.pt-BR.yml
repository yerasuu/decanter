ps.settings.games.title: Pasta de jogos
ps.settings.games.description: 'Ao lado de cada pasta de biblioteca do perfil, no mesmo disco. "Adicionar dump…", ou soltar a pasta dele na janela, copia ou move um dump para a principal, e os dumps de cada pasta aparecem por conta própria. Os saves e as configurações ficam sempre na principal; o cache vai para o local de cache da pasta de cada jogo. Para mover um jogo entre pastas, ou escolher para onde vai o cache dele, use Armazenamento.'
