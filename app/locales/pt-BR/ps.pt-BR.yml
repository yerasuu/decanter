ps.branch.title: Branch do psport, compilado neste PC (Testes)
ps.branch.description: 'O decanter busca o commit mais recente do branch do psport com o seu git, baixa a toolchain que ele fixa (llvm-mingw, CMake, Ninja e o pacote de toolchain do psport, cada um conferido com o SHA-256) e o compila aqui, sem nada do que baixa sendo executado além disso. Compilar executa os scripts do próprio branch com os seus privilégios, então cada novo commit pede a sua confirmação antes. Um build passa a ser usado assim que termina, e os builds e versões anteriores são removidos junto com seus registros.'
