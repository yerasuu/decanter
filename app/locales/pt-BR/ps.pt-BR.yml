ps.settings.sys_modules.none: Nenhuma pasta
ps.settings.sys_modules.description: 'Opcional: nenhum jogo precisa disso hoje. Uma pasta com o seu próprio dump dos módulos do console (*.sprx, como libSceNgs2.sprx), apenas para comparar com as bibliotecas do próprio port (PS_LLE) ou para um jogo que ainda precise de um módulo do console. Cada jogo escolhe se o carrega em Gráficos › Extras; por padrão todos os jogos, exceto Bloodborne, o carregam. O decanter não distribui nem copia nenhum.'
