amazon.consent.title: Antes de entrar na Amazon Games
amazon.consent.device: Ao entrar, um dispositivo que se apresenta como o aplicativo oficial da Amazon Games é registrado na sua conta da Amazon.
amazon.consent.storage: O Decanter guarda a sessão no armazenamento de segredos do seu sistema e nada mais.
amazon.consent.risk: A Amazon não publicou nenhuma permissão para isso, então sua conta pode ser limitada ou bloqueada.
amazon.consent.affiliation: O Decanter não é afiliado à Amazon.
amazon.consent.removal: Você poderá remover o dispositivo depois.
amazon.consent.accept: Aceitar e continuar
