raven.experimental: 'Экспериментально'
raven.description: 'Raven — среда выполнения Windows для Linux на ранней стадии разработки (useraven.org). decanter собирает её в вашей библиотеке из зафиксированного коммита или, по вашему запросу, из самого свежего коммита её ветки и использует для добавленных здесь программ Windows. Многие программы пока не запускаются: сейчас она нужна, чтобы её можно было попробовать.'
raven.license: 'Raven — свободное программное обеспечение (GPL-3.0 или новее). Она не входит в состав decanter; её код загружается с GitHub при сборке.'
