raven.confirm.text: 'decanter загрузит с GitHub код Raven для этого коммита (около 18 МБ), библиотеки, необходимые для сборки (из Nix, если их нет в системе), и данные, которые загружает сама сборка, а затем скомпилирует Raven в вашей библиотеке. Это займёт несколько минут. Папка сборки занимает до 5 ГБ, среда выполнения — около 140 МБ. Это сторонний код, который decanter не проверяет.'
