mods.modio.title: 'mod.io'
mods.modio.note: 'mod.io работает с вашим собственным ключом API («Настройки › Основные»). decanter обращается к mod.io только когда вы что-то делаете здесь, не чаще одного запроса в полторы секунды, и добавляет каждый файл с теми же проверками, что и архив. Подходят только игры, которые разрешают сторонние приложения на mod.io.'
