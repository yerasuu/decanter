ps.settings.games.title: 'Папка игр'
ps.settings.games.description: 'Рядом с каждой папкой библиотеки профиля, на том же диске. «Добавить дамп…» или перетаскивание его папки в окно копирует или перемещает дамп в основную папку, а дампы каждой папки появляются сами. Сохранения и настройки всегда остаются в основной; кэш попадает в расположение кэша папки каждой игры. Чтобы переместить игру между папками или выбрать, где хранится её кэш, используйте «Хранилище».'
