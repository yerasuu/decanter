ps.branch.title: 'Ветка psport, собранная на этом ПК (Тестирование)'
ps.branch.description: 'decanter получает самый свежий коммит ветки psport через ваш git, загружает зафиксированный в нём набор инструментов (llvm-mingw, CMake, Ninja и пакет инструментов psport, каждый с проверкой SHA-256) и собирает её здесь, ничего из загруженного не запуская. Сборка запускает собственные скрипты ветки с вашими правами, поэтому для каждого нового коммита сначала запрашивается ваше подтверждение. Сборка используется сразу после завершения, а предыдущие сборки и версии удаляются вместе с их журналами.'
