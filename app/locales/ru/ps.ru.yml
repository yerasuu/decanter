ps.package.description: 'Каждый выпуск psport с тегом содержит пакет для Windows: decanter загружает его, сверяет с контрольной суммой и размером из выпуска и хранит в библиотеке. Кнопка «Играть» запускает используемую версию, которая следует за новейшим выпуском, пока вы не выберете другую. Остаётся только используемая версия или сборка: когда используется другая, decanter удаляет остальные.'
