mods.thunderstore.note: 'Thunderstore не требует учётной записи. decanter обращается к нему, только когда вы что-то делаете здесь, хранит его списки в библиотеке несколько часов и добавляет каждый пакет с теми же проверками, что и архив. Thunderstore не публикует условий для своего API: если оно изменится, decanter сообщит об этом, а не будет гадать.'
