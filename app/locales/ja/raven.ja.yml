raven.experimental: "試験的"
raven.description: "Raven は Linux 向けの開発初期段階の Windows ランタイムです(useraven.org)。decanter は固定されたコミット、または要求に応じてそのブランチの最新コミットからライブラリ内でビルドし、ここで追加した Windows プログラムに使用します。まだ起動しないプログラムも多く、現時点では試用向けです。"
raven.license: "Raven はフリーソフトウェア(GPL-3.0 以降)です。decanter には同梱されておらず、ビルド時にそのコードを GitHub からダウンロードします。"
