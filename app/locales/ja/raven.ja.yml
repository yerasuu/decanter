raven.confirm.text: "decanter は、このコミットの Raven のコードを GitHub から(約 18 MB)、ビルドに必要なライブラリ(システムにない場合は Nix から)、およびビルド中にダウンロードされるデータを取得し、ライブラリ内でコンパイルします。数分かかります。ビルドフォルダーは最大で約 5 GB、ランタイムは約 140 MB を使用します。これはサードパーティのコードであり、decanter では内容を審査していません。"
