ps.settings.games.title: "ゲームフォルダー"
ps.settings.games.description: "プロファイルの各ライブラリフォルダーの隣、同じディスク上にあります。「ダンプを追加…」またはフォルダーをウィンドウにドロップすると、ダンプがメインのフォルダーにコピーまたは移動され、各フォルダーのダンプは個別に表示されます。セーブデータと設定は常にメインのフォルダーにあり、キャッシュは各ゲームのフォルダーのキャッシュ場所に保存されます。ゲームをフォルダー間で移動したり、キャッシュの保存先を選んだりするには、ストレージを使用してください。"
