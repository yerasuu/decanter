mods.thunderstore.note: 'Thunderstore는 계정이 필요 없습니다. decanter는 여기서 작업할 때만 요청하고, 목록을 몇 시간 동안 라이브러리에 보관하며, 각 패키지를 압축 파일과 같은 검사를 거쳐 추가합니다. Thunderstore는 API 이용 약관을 공개하지 않습니다. 바뀌면 decanter는 추측하지 않고 알려 줍니다.'
