ps.branch.title: psport 브랜치, 이 PC에서 빌드 (테스트)
ps.branch.description: 'decanter는 사용자의 git으로 psport 브랜치의 최신 커밋을 가져오고, 고정된 툴체인(llvm-mingw, CMake, Ninja, psport 툴체인 패키지. 각각 SHA-256으로 검증)을 다운로드하여 이곳에서 빌드하며, 다운로드한 파일 중 다른 것은 실행하지 않습니다. 빌드는 브랜치 자체 스크립트를 사용자 권한으로 실행하므로 새 커밋마다 먼저 확인을 요청합니다. 빌드는 끝나는 즉시 사용되며, 이전 빌드와 버전은 로그와 함께 삭제됩니다.'
