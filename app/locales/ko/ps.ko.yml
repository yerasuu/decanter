ps.settings.games.title: 게임 폴더
ps.settings.games.description: '프로필의 각 라이브러리 폴더 옆, 같은 디스크에 있습니다. "덤프 추가…"를 누르거나 폴더를 창에 끌어다 놓으면 덤프가 기본 폴더로 복사 또는 이동되며, 각 폴더의 덤프는 따로 표시됩니다. 저장 데이터와 설정은 항상 기본 폴더에 있고, 캐시는 각 게임 폴더의 캐시 위치로 갑니다. 폴더 간에 게임을 옮기거나 캐시 위치를 고르려면 저장 공간을 사용하세요.'
