raven.experimental: 실험적 기능
raven.description: 'Raven은 Linux용 초기 단계의 Windows 런타임입니다(useraven.org). decanter는 고정된 커밋에서, 또는 요청하면 해당 브랜치의 최신 커밋에서 라이브러리 안에 Raven을 빌드하여 여기에 추가한 Windows 프로그램에 사용합니다. 아직 시작되지 않는 프로그램이 많으며, 지금은 시험해 보는 용도입니다.'
raven.license: Raven은 자유 소프트웨어입니다(GPL-3.0 이상). decanter에 포함되어 있지 않으며, 빌드할 때 GitHub에서 코드를 다운로드합니다.
