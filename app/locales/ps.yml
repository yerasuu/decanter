  en: No assets (%{problem}). They're built from amd_fidelityfx_upscaler_dx12.dll 4.1.x (OptiScaler's FSR4_LATEST or from a game with FSR 4.1); needs GE-Proton 10+, Proton Experimental or Proton-CachyOS and takes 2–5 minutes
