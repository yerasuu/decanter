  en: Reading the keyboard…
ps.detail.explain.needs_convert:
  es: La primera vez se convierte con AnyPS5 antes de arrancar.
  en: The first time, it's converted with AnyPS5 before starting.
ps.detail.explain.needs_merge:
  es: "Hay una actualización 1.09 junto a este volcado. Fusionarla crea una copia jugable al lado, con enlaces duros: no ocupa espacio extra y el volcado original no cambia."
  en: "There's a 1.09 update next to this dump. Merging it creates a playable copy alongside, with hard links: it takes no extra space and the original dump stays unchanged."
ps.detail.explain.has_playable:
  es: Ya tienes la copia 1.09 en %{dir}; juega con esa.
  en: You already have the 1.09 copy at %{dir}; play that one.
ps.detail.explain.other_edition:
  es: bbport solo ejecuta la edición CUSA03173 de Bloodborne en su versión 1.09.
  en: bbport only runs the CUSA03173 edition of Bloodborne at version 1.09.
ps.detail.explain.needs_update:
  es: "bbport necesita la versión 1.09: añade su actualización a una de tus carpetas."
  en: "bbport needs version 1.09: add its update to one of your folders."
ps.detail.explain.experimental:
  es: "bbport solo está hecho para Bloodborne. Este juego arranca con lo que le falte al port sustituido, sin parches ni mods: mira hasta dónde llega en Registro."
  en: "bbport is only made for Bloodborne. This game starts with whatever the port lacks stubbed out, without patches or mods: see how far it gets in Log."
ps.detail.explain.needs_vr:
  es: Este juego solo arranca con un casco PS VR, y el port no tiene uno.
  en: This game only starts with a PS VR headset, and the port has none.
ps.detail.explain.encrypted:
  es: El eboot.bin sigue cifrado; hay que descifrarlo en la consola.
  en: The eboot.bin is still encrypted; it has to be decrypted on the console.
ps.detail.explain.no_eboot:
  es: Este volcado no tiene eboot.bin.
  en: This dump has no eboot.bin.
