ps.settings.games.title:
  es: Carpeta de juegos
  en: Games folder
ps.settings.games.description:
  es: "Junto a la biblioteca del perfil, en el mismo disco. Copia o mueve ahí tus volcados y aparecerán solos: cada carpeta y sus subcarpetas directas se leen tal cual."
  en: "Next to the profile's library, on the same disk. Copy or move your dumps there and they show up on their own: each folder and its direct subfolders are read as they are."
ps.settings.sys_modules.title:
  es: Módulos del sistema (opcional)
  en: System modules (optional)
ps.settings.sys_modules.none:
  es: Sin carpeta
  en: No folder
ps.settings.sys_modules.description:
  es: "Opcional: ningún juego lo necesita hoy. Una carpeta con tu propio volcado de los módulos de la consola (*.sprx, como libSceNgs2.sprx), solo para comparar con las bibliotecas propias del port (BB_LLE) o para un juego que todavía necesite un módulo de la consola. decanter no incluye ni copia ninguno."
  en: "Optional: no game needs it today. A folder with your own dump of the console's modules (*.sprx, like libSceNgs2.sprx), only to compare against the port's own libraries (BB_LLE) or for a game that still needs a console module. decanter neither ships nor copies any."
