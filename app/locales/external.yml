_version: 2
external.title:
  es: Juegos externos
  en: External games
external.intro:
  es: "Juegos de fuera de GOG: cada uno se ejecuta en su propio prefijo, igual que un juego instalado, y aparece en la Biblioteca con el resto."
  en: "Games from outside GOG: each runs in its own prefix, like an installed game, and shows up in the Library with the rest."
external.intro_native:
  es: "Juegos de fuera de GOG: cada uno se abre directamente desde su ejecutable y aparece en la Biblioteca con el resto."
  en: "Games from outside GOG: each one starts straight from its executable and shows up in the Library with the rest."
