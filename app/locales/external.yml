external.sources.hint:
  es: Con una clave de SteamGridDB la búsqueda trae sus portadas, fondos e iconos; sin ella solo busca en Steam.
  en: With a SteamGridDB key the search brings its covers, backgrounds and icons; without one it only searches Steam.
