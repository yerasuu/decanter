external.form.import.copy_hint:
  es: "Al añadir, el prefijo %{prefix} se copia a decanter: la otra herramienta lo sigue teniendo, pero ocupa el doble y las partidas quedan separadas."
  en: "When the game is added, the prefix %{prefix} is copied into decanter: the other tool keeps it, but it takes twice the space and the saves stay separate."
external.form.import.move_hint:
  es: "Al añadir, el prefijo %{prefix} se mueve a decanter: no ocupa más espacio, pero la otra herramienta se queda sin él."
  en: "When the game is added, the prefix %{prefix} is moved into decanter: it takes no extra space, but the other tool loses it."
