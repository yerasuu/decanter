ps.settings.games.title: Cartella dei giochi
ps.settings.games.description: "Accanto a ciascuna cartella della libreria del profilo, sullo stesso disco. “Aggiungi dump…”, o rilasciare la sua cartella sulla finestra, copia o sposta un dump in quella principale, e i dump di ogni cartella compaiono da soli. I salvataggi e le impostazioni restano sempre in quella principale; la cache va nella posizione della cache della cartella di ogni gioco. Per spostare un gioco tra cartelle, o scegliere dove va la sua cache, usa Archiviazione."
ps.settings.sys_modules.title: Moduli di sistema (facoltativo)
ps.settings.sys_modules.none: Nessuna cartella
ps.settings.sys_modules.description: "Facoltativo: oggi nessun gioco ne ha bisogno. Una cartella con il tuo dump dei moduli della console (*.sprx, come libSceNgs2.sprx), solo per confrontarli con le librerie del port (PS_LLE) o per un gioco che ha ancora bisogno di un modulo della console. Ogni gioco sceglie se caricarlo in Grafica › Extra; per impostazione predefinita lo fanno tutti tranne Bloodborne. decanter non ne include né ne copia."
