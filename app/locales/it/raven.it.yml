raven.confirm.title: Compilare Raven?
raven.confirm.repo: "Repository: %{repo}"
raven.confirm.commit: "Commit: %{commit}"
raven.confirm.text: "decanter scaricherà da GitHub il codice di Raven a questo commit (circa 18 MB), le librerie necessarie alla compilazione (da Nix, se il tuo sistema non le ha) e i dati che la compilazione scarica, e lo compilerà nella tua libreria. Richiede alcuni minuti. La cartella di compilazione occupa fino a circa 5 GB e il runtime circa 140 MB. È codice di terze parti che decanter non verifica."
