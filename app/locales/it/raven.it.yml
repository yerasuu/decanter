raven.confirm.title: Compilare Raven?
raven.confirm.repo: "Repository: %{repo}"
raven.confirm.commit: "Commit: %{commit}"
raven.confirm.text: "decanter scaricherà da GitHub il codice di Raven a questo commit (circa 7 MB), gli strumenti necessari alla compilazione, tra cui i compilatori MinGW a 64 e 32 bit e il compilatore Clang (da Nix, se il tuo sistema non li ha; Clang aggiunge circa 150 MB da scaricare), i dati che la compilazione scarica (circa 15 MB), per i componenti di installazione il codice sorgente di zlib (zlib.net), libjpeg (ijg.org), LibTIFF (download.osgeo.org), libxml2 e libxslt (download.gnome.org), circa 11 MB, e, per il testo nelle finestre dei programmi, i font Liberation (dall’archivio di Ubuntu, archive.ubuntu.com) e i font DejaVu (dal progetto DejaVu su GitHub), circa 7 MB, ciascuno dal suo sito ufficiale e verificato con il suo hash fissato, oltre al codice sorgente della libreria grafica Skia a un commit fissato (skia.googlesource.com, circa 80 MB). Compilerà Raven nella tua libreria insieme ai componenti di cui hanno bisogno i programmi Windows, costruiti dal codice sorgente di Raven stesso e da queste librerie: la sua libreria di runtime, il runtime C, i controlli comuni, i servizi di Windows Installer (msi, cabinet, rpcrt4, msxml3 e altri) e il disegno del testo usato da finestre e finestre di dialogo (Skia con questi font), per i programmi a 64 e 32 bit. Richiede circa 7 minuti su un computer veloce, di più su uno più lento. La cartella di compilazione occupa circa 1,5 GB e il runtime circa 200 MB. È codice di terze parti che decanter non verifica."
