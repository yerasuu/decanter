raven.experimental: Sperimentale
raven.description: "Raven è un runtime Windows per Linux in fase iniziale (useraven.org). decanter lo compila nella tua libreria da un commit fissato, o dall'ultimo commit del suo ramo quando lo chiedi, e lo usa per i programmi Windows che aggiungi qui. Molti programmi non si avviano ancora: per ora è qui per provarlo."
raven.license: "Raven è software libero (GPL-3.0 o successiva). Non è incluso in decanter; il suo codice viene scaricato da GitHub quando viene compilato."
