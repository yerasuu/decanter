amazon.consent.title: Antes de iniciar sesión en Amazon Games
amazon.consent.device: Al iniciar sesión se registra en tu cuenta de Amazon un dispositivo que se presenta como la aplicación oficial de Amazon Games.
amazon.consent.storage: Decanter guarda la sesión en el almacén de secretos de tu sistema y nada más.
amazon.consent.risk: Amazon no ha publicado ningún permiso para esto, así que podría limitar o bloquear tu cuenta.
amazon.consent.affiliation: Decanter no está afiliado a Amazon.
amazon.consent.removal: Podrás quitar el dispositivo más adelante.
amazon.consent.accept: Aceptar y continuar
