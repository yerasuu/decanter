settings.general.close_game.title: Cerrar un juego
settings.general.close_game.enabled: Cerrar el juego en marcha desde el mando o el teclado
settings.general.close_game.hint: Mantén Select + Start %{hold} segundos en cualquier mando, o pulsa Ctrl+Mayús+F4 en Plasma (se cambia en Preferencias del sistema > Atajos > Decanter). Decanter avisa antes de cerrarlo; si repites la combinación en los %{grace} segundos siguientes, lo cancela. En los juegos de PS4, el botón Guide abre además el aviso de cierre del propio juego.
settings.general.close_game.enabled_keyboard: Cerrar el juego en marcha con un atajo de teclado
settings.general.close_game.hint_keyboard: Pulsa Ctrl+Mayús+F4 mientras juegas. Decanter cierra el juego %{grace} segundos después; si vuelves a pulsarlo antes, lo cancela.
settings.general.steam.title: Exportar a Steam
settings.general.steam.add: Añadir cada juego instalado a la biblioteca real de Steam, con su portada y su banner
settings.general.steam.restart_hint: Hay que reiniciar Steam para ver los cambios — Steam solo lee sus accesos directos al arrancar.
settings.general.raven.title: Raven (experimental)
settings.general.raven.enable: Mostrar la sección Raven
settings.general.raven.hint: 'Raven es un runtime de Windows en fase temprana. Con la sección activada puedes construirlo en tu biblioteca y probar con él programas de Windows; no se descarga nada hasta que pulses Construir en la sección.'
settings.general.steam.pending: Hay juegos exportados a Steam esperando a que se reinicie — Steam estaba abierto cuando se añadieron, así que su propia copia en memoria todavía no los ha sobrescrito.
