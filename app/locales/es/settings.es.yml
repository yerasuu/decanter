settings.compatibility.intro: Cada juego se ejecuta en su propio prefijo, creado la primera vez que lo abres. Para fijar un Proton distinto o restablecer el prefijo de un juego concreto, abre sus Propiedades desde la biblioteca.
settings.compatibility.default: Proton por defecto
settings.compatibility.automatic: Automático (lo resuelve umu)
settings.compatibility.none_installed: No hay Proton instalado en Steam (compatibilitytools.d). umu descargará uno la primera vez.
settings.compatibility.game_tools.title: Herramientas de juego
settings.compatibility.game_tools.intro: Se aplican a los juegos de PC y de PS que no tienen una elección propia; cada juego puede cambiarla en sus Propiedades (PC) o en su Resumen (PS).
settings.compatibility.game_tools.mangohud: Mostrar MangoHud (FPS, tiempos de fotograma, uso de CPU y GPU)
settings.compatibility.game_tools.mangohud_log: Registrar el rendimiento desde el inicio de cada partida con MangoHud
settings.compatibility.game_tools.mangohud_log_hint: Los registros se guardan en decanter/logs/mangohud dentro de la biblioteca. Sin esta opción, empiezan y terminan con el atajo de MangoHud (Mayús izquierda + F2).
settings.compatibility.game_tools.gamemode: Activar GameMode mientras se juega
settings.compatibility.game_tools.gamemode_hint: GameMode pone la CPU en modo rendimiento y aplica el resto de ajustes de tu gamemode.ini hasta que el juego se cierra.
