raven.experimental: Experimental
raven.description: 'Raven es un runtime de Windows para Linux en una fase temprana (useraven.org). decanter lo construye en tu biblioteca a partir de un commit fijado y lo usa para los programas de Windows que añadas aquí. Muchos programas aún no arrancan: de momento sirve para probarlo.'
raven.license: Raven es software libre (GPL-3.0 o posterior). No viene con decanter; su código se descarga de GitHub al construirlo.
