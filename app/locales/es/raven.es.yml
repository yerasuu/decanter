raven.confirm.title: ¿Construir Raven?
raven.confirm.repo: 'Repositorio: %{repo}'
raven.confirm.commit: 'Commit: %{commit}'
raven.confirm.text: 'decanter descargará de GitHub el código de Raven en este commit (unos 7 MB), las herramientas que necesita para compilarse, entre ellas los compiladores MinGW de 64 y 32 bits y el compilador Clang (desde Nix, si tu sistema no las tiene; Clang añade unos 150 MB de descarga), los datos que su compilación descarga (unos 15 MB), para los componentes de instalación el código fuente de zlib (zlib.net), libjpeg (ijg.org), LibTIFF (download.osgeo.org), libxml2 y libxslt (download.gnome.org), unos 11 MB, y, para el texto de las ventanas de los programas, las fuentes Liberation (del archivo de Ubuntu, archive.ubuntu.com) y las fuentes DejaVu (del proyecto DejaVu en GitHub), unos 7 MB, cada uno de su web oficial y comprobado con su hash fijado, y el código fuente de la biblioteca gráfica Skia en un commit fijado (skia.googlesource.com, unos 80 MB). Compilará Raven en tu biblioteca junto con los componentes que necesitan los programas de Windows, hechos a partir del código del propio Raven y de esas bibliotecas: su biblioteca de ejecución, el runtime de C, los controles comunes, los servicios de Windows Installer (msi, cabinet, rpcrt4, msxml3 y otros) y el dibujo de texto que usan las ventanas y los diálogos (Skia con esas fuentes), para programas de 64 y 32 bits. Tarda unos 7 minutos en un equipo rápido y más en uno lento. La carpeta de construcción ocupa alrededor de 1,5 GB y el runtime unos 200 MB. También descargará del repositorio público de Microsoft (microsoft.com/pki, unos pocos KB) sus certificados raíz de firma de código, cada uno comprobado con su hash fijado, para que los instaladores puedan verificar las firmas de Microsoft; al descargarlos aceptas el acuerdo de usuario de confianza de los servicios PKI de Microsoft (Relying Party Agreement, enlace abajo). Es código de terceros que decanter no revisa.'
