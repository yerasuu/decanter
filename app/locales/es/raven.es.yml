raven.confirm.text: 'decanter descargará de GitHub el código de Raven en este commit (unos 18 MB), las bibliotecas que necesita para compilarse (desde Nix, si tu sistema no las tiene) y los datos que su compilación descarga, y lo compilará en tu biblioteca. Tarda unos minutos. La carpeta de construcción ocupa hasta unos 5 GB y el runtime unos 140 MB. Es código de terceros que decanter no revisa.'
