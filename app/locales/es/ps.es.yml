ps.branch.title: Rama de psport, compilada en este PC (Pruebas)
ps.branch.description: 'decanter obtiene el commit más reciente de la rama de psport con tu git, descarga la toolchain que fija (llvm-mingw, CMake, Ninja y el paquete de toolchain de psport, cada uno comprobado con su SHA-256) y la compila aquí, sin ejecutar nada más de lo que descarga. Compilar ejecuta los scripts de la propia rama con tus permisos, así que cada commit nuevo te pide confirmación antes.'
