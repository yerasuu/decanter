<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a3f"/>
      <stop offset="1" stop-color="#160a1c"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8344f"/>
      <stop offset="1" stop-color="#7a1028"/>
    </linearGradient>
    <clipPath id="glass">
      <path d="M226 100 L240 214 C240 246 196 250 158 284 C116 322 104 372 122 400 C140 426 196 432 256 432 C316 432 372 426 390 400 C408 372 396 322 354 284 C316 250 272 246 272 214 L286 100 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- glass body -->
  <path d="M226 100 L240 214 C240 246 196 250 158 284 C116 322 104 372 122 400 C140 426 196 432 256 432 C316 432 372 426 390 400 C408 372 396 322 354 284 C316 250 272 246 272 214 L286 100 Z"
        fill="#ffffff" fill-opacity="0.08"/>

  <!-- wine -->
  <g clip-path="url(#glass)">
    <path d="M90 318 C150 300 200 336 256 318 C312 300 362 336 422 318 L422 440 L90 440 Z" fill="url(#wine)"/>
    <path d="M90 318 C150 300 200 336 256 318 C312 300 362 336 422 318" fill="none" stroke="#ff8a9b" stroke-opacity="0.6" stroke-width="6"/>
  </g>

  <!-- play mark in the wine -->
  <path d="M240 352 L240 404 L286 378 Z" fill="#fbeef1" stroke="#fbeef1" stroke-width="10" stroke-linejoin="round"/>

  <!-- glass outline -->
  <path d="M226 100 L240 214 C240 246 196 250 158 284 C116 322 104 372 122 400 C140 426 196 432 256 432 C316 432 372 426 390 400 C408 372 396 322 354 284 C316 250 272 246 272 214 L286 100 Z"
        fill="none" stroke="#f3e6ec" stroke-width="12" stroke-linejoin="round"/>

  <!-- lip -->
  <rect x="212" y="82" width="88" height="22" rx="11" fill="#f3e6ec"/>

  <!-- highlight -->
  <path d="M146 370 C142 334 166 304 196 286" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>
  <path d="M244 124 L252 196" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
</svg>
