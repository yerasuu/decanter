[package]
name = "decanter"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
# Without `wayland`/`x11`, gpui_platform silently runs headless.
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
decanter-core.workspace = true
decanter-gog.workspace = true
decanter-ps.workspace = true
decanter-runtime.workspace = true
dirs.workspace = true
uuid = { workspace = true, features = ["v4"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time", "fs", "net", "process", "signal", "sync", "rt-multi-thread", "macros", "io-util"] }
open.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
rfd.workspace = true
futures.workspace = true
md5.workspace = true
minisign-verify.workspace = true
unicode-segmentation.workspace = true
reqwest.workspace = true
image.workspace = true
rust-i18n.workspace = true
thiserror.workspace = true

[build-dependencies]
minisign-verify.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true
nix = { workspace = true, features = ["fs", "inotify"] }
zbus.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
global-hotkey.workspace = true
tray-icon.workspace = true

# `decanter-cli.exe`, built only on Windows: Cargo can't gate a `[[bin]]` by target, so the
# Windows build asks for it with `--features decanter/windows-cli`.
[features]
windows-cli = []

[[bin]]
name = "decanter-cli"
path = "src/cli_shim.rs"
required-features = ["windows-cli"]
