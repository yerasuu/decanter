[package]
name = "decanter"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
# Without `wayland`/`x11`, gpui_platform silently runs headless.
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
decanter-core.workspace = true
decanter-gog.workspace = true
decanter-ps.workspace = true
decanter-runtime.workspace = true
dirs.workspace = true
uuid = { workspace = true, features = ["v4"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time", "fs", "net", "process", "signal", "sync", "rt-multi-thread", "macros"] }
open.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
rfd.workspace = true
futures.workspace = true
md5.workspace = true
unicode-segmentation.workspace = true
reqwest.workspace = true
image.workspace = true
rust-i18n.workspace = true
thiserror.workspace = true
nix = { workspace = true, features = ["fs", "inotify"] }
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true
