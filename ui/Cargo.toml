[package]
name = "decanter"
version.workspace = true
authors.workspace = true
edition.workspace = true
build = "build.rs"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
decanter-core = { path = "../crates/core" }
decanter-gog = { path = "../crates/gog" }
decanter-runtime = { path = "../crates/runtime" }
uuid = { version = "1.26.0", features = ["v4"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["time", "fs", "signal", "rt-multi-thread", "macros"] }
dirs = "7.0.0"
open = "5.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
rfd = "0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
image = "0.25.10"
glib = "0.18.5"

[features]
default = ["desktop"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server"]
